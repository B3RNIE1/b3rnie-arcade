<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2048 | B3RNIE Arcade</title>
    <style>
        /* ==========================================================================
           1. CORE THEME & LAYOUT (B3RNIE Arcade Purple Palette Style)
           ========================================================================== */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .arcade-card {
            background-color: #111111;
            border: 1px solid #2a1b4e;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.15);
            position: relative;
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-emoji {
            font-size: 2rem;
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #a04ef6, #621fa7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            background-color: #07050c;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #1f1435;
        }

        .score-box {
            font-size: 0.95rem;
            color: #b19ffb;
        }

        .bold-text {
            font-weight: 700;
            color: #ffffff;
        }

        /* ==========================================================================
           2. 2048 SLIDING MATRIX GRID CONTAINER
           ========================================================================== */
        .grid-wrapper {
            position: relative;
            width: 332px;
            height: 332px;
            background-color: #060409;
            border: 1px solid #201438;
            border-radius: 8px;
            margin: 0 auto;
            padding: 8px;
            box-sizing: border-box;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 8px;
            width: 100%;
            height: 100%;
        }

        .tile-node {
            background-color: rgba(32, 20, 56, 0.2);
            border-radius: 6px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
            transition: all 0.1s ease;
        }

        /* Game Over Layer Popup overlay screens */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(6, 4, 9, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            z-index: 10;
            display: none;
        }

        .instruction-text {
            color: #c9bfeb;
            font-size: 0.9rem;
            text-align: center;
            margin: 0;
        }

        /* ==========================================================================
           3. DYNAMIC B3A PURPLE PALETTE TILES
           ========================================================================== */
        .tile-2 { background-color: #2e1a47; color: #d6c7f5; }
        .tile-4 { background-color: #3d225c; color: #d6c7f5; }
        .tile-8 { background-color: #5c3085; color: #ffffff; }
        .tile-16 { background-color: #723baf; color: #ffffff; }
        .tile-32 { background-color: #8a2be2; box-shadow: 0 0 10px rgba(138,43,226,0.3); }
        .tile-64 { background-color: #993ff3; box-shadow: 0 0 12px rgba(153,63,243,0.4); }
        .tile-128 { background-color: #ac5df6; font-size: 1.4rem; }
        .tile-256 { background-color: #be7bf9; font-size: 1.4rem; box-shadow: 0 0 15px #be7bf9; }
        .tile-512 { background-color: #d199fc; font-size: 1.4rem; color: #000; }
        .tile-1024 { background-color: #e3b6fe; font-size: 1.2rem; color: #000; }
        .tile-2048 { background-color: #f6d4ff; font-size: 1.2rem; color: #000; box-shadow: 0 0 25px #f6d4ff; }

        .action-btn {
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.1s ease;
            width: 100%;
            text-transform: uppercase;
        }
        .action-btn:hover { background-color: #993ff3; }
    </style>
</head>
<body>

    <div class="arcade-card">
        <div class="header-section">
            <span class="game-emoji">🔢</span>
            <h1 class="game-title">2048 Arcade</h1>
        </div>

        <div class="score-container">
            <div class="score-box">Score: <span id="current-score" class="bold-text">0</span></div>
            <div class="score-box">Record: <span id="high-score" class="bold-text">0</span></div>
        </div>

        <div class="grid-wrapper">
            <div class="grid-container" id="grid-board"></div>
            
            <!-- Game Over Screen UI Card Layer -->
            <div id="gameover-overlay" class="overlay">
                <h2 style="color:#ff4a4a; margin-bottom:5px;">💥 Game Over</h2>
                <p style="margin-bottom:20px;">Final Score: <span id="final-score" class="bold-text">0</span></p>
                <button id="restart-btn" class="action-btn" style="max-width:200px;">PLAY AGAIN</button>
            </div>
        </div>

        <p class="instruction-text">Use your keyboard <strong>Arrow Keys</strong> to slide tiles!</p>
        <button id="reset-btn" class="action-btn">NEW GAME</button>
    </div>

    <!-- ==========================================================================
       4. GAME ENGINE GRID CALCULATOR
       ========================================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const boardDOM = document.getElementById('grid-board');
            const gameoverOverlay = document.getElementById('gameover-overlay');
            const restartBtn = document.getElementById('restart-btn');
            const resetBtn = document.getElementById('reset-btn');
            
            const currentScoreEl = document.getElementById('current-score');
            const highScoreEl = document.getElementById('high-score');
            const finalScoreEl = document.getElementById('final-score');

            let score = 0;
            let highScore = localStorage.getItem('b3a_2048_high') || 0;
            highScoreEl.textContent = highScore;

            let board = Array.from({ length: 4 }, () => Array(4).fill(0));

            // Run setup process instantly
            startNewGame();

            function startNewGame() {
                score = 0;
                currentScoreEl.textContent = score;
                board = Array.from({ length: 4 }, () => Array(4).fill(0));
                gameoverOverlay.style.display = 'none';
                
                spawnRandomTile();
                spawnRandomTile();
                renderBoardDOM();
            }

            function spawnRandomTile() {
                let emptyCells = [];
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        if (board[r][c] === 0) emptyCells.push({ r, c });
                    }
                }
                if (emptyCells.length > 0) {
                    let { r, c } = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                    board[r][c] = Math.random() < 0.9 ? 2 : 4;
                }
            }

            function renderBoardDOM() {
                boardDOM.innerHTML = '';
                for (let r = 0; r < 4; r++) {
                    for (let c = 0; c < 4; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'tile-node';
                        if (board[r][c] > 0) {
                            cell.textContent = board[r][c];
                            cell.classList.add(`tile-${board[r][c]}`);
                        }
                        boardDOM.appendChild(cell);
                    }
                }
            }

            // High reliability matrix slide/merge calculations
            function slideRowLeft(row) {
                let filtered = row.filter(val => val !== 0);
                for (let i = 0; i < filtered.length - 1; i++) {
                    if (filtered[i] === filtered[i + 1]) {
                        filtered[i] *= 2;
                        score += filtered[i];
                        filtered[i + 1] = 0;
                    }
                }
                filtered = filtered.filter(val => val !== 0);
                while (filtered.length < 4) filtered.push(0);
                return filtered;
            }
