<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B3A SKETCH MASTER - B3RNIE Arcade</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --container-bg: #1a1a1c;
            --accent: #a855f7;
            --border-color: #3a3a3c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            margin: 5px 0;
            color: var(--accent);
            letter-spacing: 2px;
            font-size: 1.8rem;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .target-title {
            font-size: 1.4rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: #fff;
            min-height: 30px;
        }

        .canvas-area {
            position: relative;
            width: 320px;
            height: 320px;
            background: #27272a;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            cursor: crosshair;
            touch-action: none;
        }

        .face-blueprint {
            position: absolute;
            top: 0;
            left: 0;
            width: 320px;
            height: 320px;
            z-index: 1;
            opacity: 0;
            transition: opacity 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .svg-guide {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: rgba(168, 85, 247, 0.5);
            stroke-width: 4;
            stroke-linecap: round;
        }

        .btn-panel {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin-top: 15px;
        }

        button {
            padding: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            background-color: #3f3f46;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover { background-color: #52525b; }
        #submit-btn { background-color: var(--accent); flex: 2; }
        #submit-btn:hover { background-color: #9333ea; }
        #clear-btn { flex: 1; }

        .progress-bar {
            font-size: 0.85rem;
            color: #a1a1aa;
            margin-bottom: 10px;
        }

        #result-popup {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ade80;
            margin-top: 10px;
            text-align: center;
            min-height: 30px;
        }
        
        #start-prompt-btn {
            background-color: var(--accent);
            margin-bottom: 15px;
            width: 100%;
            max-width: 320px;
        }
        #start-prompt-btn:hover { background-color: #9333ea; }
    </style>
</head>
<body>

    <header>
        <h1>B3A SKETCH MASTER</h1>
        <div class="progress-bar">Endless Arcade Mode ⚡</div>
    </header>

    <div class="game-container">
        <!-- FIXED ACTIVE BUTTON COUPLING -->
        <button id="start-prompt-btn">Tap to Start / Get Challenger</button>
        <div id="target-name" class="target-title">Press Start Above!</div>
        
        <div class="canvas-area">
            <div id="blueprint-view" class="face-blueprint">
                <svg class="svg-guide" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="30" id="head-shape" />
                    <ellipse cx="50" cy="45" rx="20" ry="25" id="inner-features" />
                    <line x1="38" y1="42" x2="44" y2="42" />
                    <line x1="56" y1="42" x2="62" y2="42" />
                    <path d="M 42 62 Q 50 68 58 62" />
                </svg>
            </div>
            <canvas id="sketchpad" width="320" height="320"></canvas>
        </div>

        <div id="result-popup"></div>

        <div class="btn-panel">
            <button id="clear-btn">Clear</button>
            <button id="submit-btn">Submit Sketch</button>
            <button onclick="window.location.href='index.html'" style="background:#121213; border:1px solid var(--border-color);">Hub</button>
        </div>
    </div>

    <script>
        const masterPool = [
            { name: "LeBron James", cx: 50, cy: 46, rx: 22, ry: 32 },
            { name: "Stephen Curry", cx: 50, cy: 48, rx: 20, ry: 28 },
            { name: "Michael Jordan", cx: 50, cy: 45, rx: 21, ry: 29 },
            { name: "Kobe Bryant", cx: 50, cy: 44, rx: 20, ry: 30 },
            { name: "Victor Wembanyama", cx: 50, cy: 42, rx: 16, ry: 34 },
            { name: "Shaquille O'Neal", cx: 50, cy: 46, rx: 26, ry: 31 },
            { name: "Shai Gilgeous-Alexander", cx: 50, cy: 45, rx: 18, ry: 32 },
            { name: "Luka Doncic", cx: 50, cy: 49, rx: 23, ry: 27 },
            { name: "Nikola Jokic", cx: 50, cy: 50, rx: 24, ry: 28 },
            { name: "Kai Cenat", cx: 50, cy: 47, rx: 19, ry: 27 },
            { name: "KSI", cx: 50, cy: 45, rx: 22, ry: 28 },
            { name: "MrBeast", cx: 50, cy: 48, rx: 21, ry: 29 },
            { name: "IShowSpeed", cx: 50, cy: 44, rx: 18, ry: 29 },
            { name: "Airrack", cx: 50, cy: 47, rx: 21, ry: 28 },
            { name: "Preston", cx: 50, cy: 48, rx: 20, ry: 27 },
            { name: "Cristiano Ronaldo", cx: 50, cy: 44, rx: 19, ry: 31 },
            { name: "Lionel Messi", cx: 50, cy: 49, rx: 20, ry: 27 },
            { name: "FaZe Rug", cx: 50, cy: 46, rx: 20, ry: 28 },
            { name: "Logan Paul", cx: 50, cy: 46, rx: 23, ry: 30 },
            { name: "Ryan Trahan", cx: 50, cy: 47, rx: 19, ry: 28 },
            { name: "Jesser", cx: 50, cy: 48, rx: 21, ry: 29 },
            { name: "AJ Shabeel", cx: 50, cy: 43, rx: 17, ry: 33 },
            { name: "Niko Omilana", cx: 50, cy: 46, rx: 22, ry: 29 }
        ];

        let activeStar = null;
        let drawingDataPoints = [];
        let isDrawing = false;

        const canvas = document.getElementById('sketchpad');
        const ctx = canvas.getContext('2d');
        const blueprintView = document.getElementById('blueprint-view');
        const resultPopup = document.getElementById('result-popup');

        function pickRandomChallenge() {
            const randomIndex = Math.floor(Math.random() * masterPool.length);
            activeStar = masterPool[randomIndex];
            
            // UPDATED: Instantly drops the random name directly onto the screen text string
            document.getElementById('target-name').innerText = `Draw: ${activeStar.name}`;
            
            document.getElementById('head-shape').setAttribute('cy', activeStar.cy);
            document.getElementById('head-shape').setAttribute('r', activeStar.ry);
            document.getElementById('inner-features').setAttribute('cy', activeStar.cy);
            document.getElementById('inner-features').setAttribute('rx', activeStar.rx);
            document.getElementById('inner-features').setAttribute('ry', activeStar.ry - 4);

            clearPad();
        }

        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 4;
        ctx.lineCap = 'round';

        function getCoords(e) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: e.clientX - rect.left,
                y: e.clientY - rect.top
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            isDrawing = true;
            canvas.setPointerCapture(e.pointerId);
            const coords = getCoords(e);
            ctx.beginPath();
            ctx.moveTo(coords.x, coords.y);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            const coords = getCoords(e);
            ctx.lineTo(coords.x, coords.y);
            ctx.stroke();
            drawingDataPoints.push(coords);
        });

        canvas.addEventListener('pointerup', (e) => {
            isDrawing = false;
            canvas.releasePointerCapture(e.pointerId);
        });

        function clearPad() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            blueprintView.style.opacity = 0;
            resultPopup.innerText = '';
            drawingDataPoints = [];
            
            const sBtn = document.getElementById('submit-btn');
            sBtn.innerText = "Submit Sketch";
        }

        function evaluateSketchScore() {
            if (!activeStar) {
                resultPopup.innerText = "Tap start above first!";
                return;
            }
            if (drawingDataPoints.length < 5) {
                resultPopup.innerText = "Draw something first!";
                return;
            }

            let targetCenterX = 160;
