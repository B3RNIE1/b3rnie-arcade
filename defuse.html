<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Millisecond | B3RNIE Arcade</title>
    <style>
        /* ==========================================================================
           1. CORE THEME & LAYOUT (B3RNIE Arcade Purple Palette Style)
           ========================================================================== */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .arcade-card {
            background-color: #111111;
            border: 1px solid #2a1b4e;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.15);
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-emoji {
            font-size: 2rem;
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #a04ef6, #621fa7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            background-color: #07050c;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #1f1435;
        }

        .score-box {
            font-size: 0.95rem;
            color: #b19ffb;
        }

        .bold-text {
            font-weight: 700;
            color: #ffffff;
        }

        /* ==========================================================================
           2. BOMB DISPLAY & DYNAMIC TIMER AREA
           ========================================================================== */
        .timer-display-box {
            background-color: #060409;
            border: 1px solid #201438;
            border-radius: 8px;
            height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }

        /* Success & Explosion Background Flash Triggers */
        .timer-display-box.success-flash {
            background-color: #0c2012;
            border-color: #1b4e28;
        }

        .timer-display-box.fail-flash {
            background-color: #240909;
            border-color: #521818;
        }

        #timer-text {
            font-size: 4rem;
            font-weight: 800;
            font-family: Courier, monospace;
            color: #ff4a4a;
            letter-spacing: -2px;
            margin: 0;
            text-shadow: 0 0 15px rgba(255, 74, 74, 0.4);
            transition: color 0.1s ease;
        }

        #timer-text.defused-text {
            color: #00ff66;
            text-shadow: 0 0 15px rgba(0, 255, 102, 0.4);
        }

        .status-banner {
            font-size: 1rem;
            font-weight: 700;
            color: #b19ffb;
            margin-top: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
            height: 20px;
        }

        /* ==========================================================================
           3. BUTTON INPUT ARCHITECTURES
           ========================================================================== */
        .action-btn {
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 16px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.1s ease, transform 0.05s ease;
            width: 100%;
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .action-btn:hover {
            background-color: #993ff3;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        /* Custom trigger button configuration states */
        .action-btn.defuse-state {
            background-color: #e63946;
            box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
        }
        .action-btn.defuse-state:hover {
            background-color: #ff4d5a;
        }
    </style>
</head>
<body>

    <div class="arcade-card">
        <div class="header-section">
            <span class="game-emoji">💥</span>
            <h1 class="game-title">1-MS Defuse</h1>
        </div>

        <div class="score-container">
            <div class="score-box">Defused: <span id="current-score" class="bold-text">0</span></div>
            <div class="score-box">Best Streak: <span id="high-score" class="bold-text">0</span></div>
        </div>

        <div class="timer-display-box" id="display-container">
            <div id="timer-text">1.000</div>
            <div id="status-message" class="status-banner">READY OPERATOR</div>
        </div>

        <button id="action-trigger" class="action-btn">START BOMB</button>
    </div>

    <!-- ==========================================================================
       4. GAMEPLAY LOGIC ARCHITECTURE
       ========================================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const timerText = document.getElementById('timer-text');
            const statusMessage = document.getElementById('status-message');
            const actionTrigger = document.getElementById('action-trigger');
            const displayContainer = document.getElementById('display-container');
            const currentScoreEl = document.getElementById('current-score');
            const highScoreEl = document.getElementById('high-score');

            let streak = 0;
            let bestStreak = localStorage.getItem('defuse_highStreak') || 0;
            highScoreEl.textContent = bestStreak;

            let gameState = "READY"; // READY, TICKING, RESULT
            let startTime = 0;
            let timerInterval = null;
            const DURATION = 1000; // 1 whole second target window in milliseconds

            function updateDisplayLoop() {
                const elapsed = window.performance.now() - startTime;
                const remaining = DURATION - elapsed;

                if (remaining <= 0) {
                    // Time ran out completely - Automatic detonation
                    triggerExplosion(0);
                } else {
                    // Format milliseconds to clean 3-digit decimal string output
                    const standardSeconds = (remaining / 1000).toFixed(3);
                    timerText.textContent = standardSeconds;
                }
            }

            function startTimer() {
                gameState = "TICKING";
                statusMessage.textContent = "DEFUSE AT THE LAST SECOND!";
                
                // Reset display styles
                timerText.className = "";
                displayContainer.className = "timer-display-box";
                
                actionTrigger.textContent = "DEFUSE NOW!";
                actionTrigger.classList.add('defuse-state');

                startTime = window.performance.now();
                // Run calculations at maximum hardware browser tick rates for microsecond tracking
                timerInterval = setInterval(updateDisplayLoop, 1);
            }

            function stopTimer() {
                clearInterval(timerInterval);
                const elapsed = window.performance.now() - startTime;
                const remaining = DURATION - elapsed;
                
                gameState = "RESULT";
                actionTrigger.classList.remove('defuse-state');
                actionTrigger.textContent = "TRY AGAIN";

                const formattedTime = (Math.max(0, remaining) / 1000).toFixed(3);
                timerText.textContent = formattedTime;

                // WIN CONDITION: Must click between 0.100 and 0.001 seconds remaining
                if (remaining > 0 && remaining <= 100) {
                    streak++;
                    currentScoreEl.textContent = streak;
                    
                    if (streak > bestStreak) {
                        bestStreak = streak;
                        localStorage.setItem('defuse_highStreak', bestStreak);
                        highScoreEl.textContent = bestStreak;
                    }

                    timerText.classList.add('defused-text');
                    displayContainer.classList.add('success-flash');
                    statusMessage.style.color = "#00ff66";
                    statusMessage.textContent = `⚡ SAFE! Defused with ${Math.round(remaining)}ms!`;
                } else if (remaining <= 0) {
                    triggerExplosion(0);
                } else {
                    // Clicked way too early (above 100ms)
                    streak = 0;
                    currentScoreEl.textContent = streak;
                    displayContainer.classList.add('fail-flash');
                    statusMessage.style.color = "#ff4a4a";
