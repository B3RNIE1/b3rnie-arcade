<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfect Stack | B3RNIE Arcade</title>
    <style>
        /* ==========================================================================
           1. CORE THEME & LAYOUT (B3RNIE Arcade Purple Palette Style)
           ========================================================================== */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .arcade-card {
            background-color: #111111;
            border: 1px solid #2a1b4e; /* Subtle purple tone border tint */
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.15);
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-emoji {
            font-size: 2rem;
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #a04ef6, #621fa7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            background-color: #07050c;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #1f1435;
        }

        .score-box {
            font-size: 0.95rem;
            color: #b19ffb;
        }

        .bold-text {
            font-weight: 700;
            color: #ffffff;
        }

        /* ==========================================================================
           2. CANVAS & RUNTIME INTERACTIVE OVERLAYS
           ========================================================================== */
        .canvas-wrapper {
            position: relative;
            width: 332px;
            height: 400px;
            border-radius: 8px;
            overflow: hidden;
            background-color: #060409;
            border: 1px solid #201438;
            margin: 0 auto;
        }

        canvas {
            display: block;
            background-color: #060409;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(6, 4, 9, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            z-index: 10;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .instruction-text {
            color: #c9bfeb;
            line-height: 1.5;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .gameover-title {
            margin: 0 0 10px 0;
            color: #ff4a4a;
        }

        /* ==========================================================================
           3. INTERACTIVE LAYOUT CONTROL ARCS
           ========================================================================== */
        .action-btn {
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px 24px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.1s ease, transform 0.05s ease;
            width: 100%;
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
        }

        .action-btn:hover {
            background-color: #993ff3;
        }

        .action-btn:active {
            transform: scale(0.98);
        }

        .drop-btn-layout {
            background-color: #160f29;
            color: #b19ffb;
            border: 1px solid #3d266e;
            padding: 16px;
            box-shadow: none;
        }

        .drop-btn-layout:hover:not(:disabled) {
            background-color: #231742;
            color: #ffffff;
        }

        .drop-btn-layout:disabled {
            opacity: 0.2;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

    <div class="arcade-card">
        <div class="header-section">
            <span class="game-emoji">🧱</span>
            <h1 class="game-title">Perfect Stack</h1>
        </div>

        <div class="score-container">
            <div class="score-box">Score: <span id="current-score" class="bold-text">0</span></div>
            <div class="score-box">High Score: <span id="high-score" class="bold-text">0</span></div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="gameCanvas" width="332" height="400"></canvas>
            
            <div id="start-overlay" class="overlay active">
                <p class="instruction-text">Tap or press <strong>Spacebar</strong> to drop the sliding block perfectly on top of the stack!</p>
                <button id="start-btn" class="action-btn">START GAME</button>
            </div>
            
            <div id="gameover-overlay" class="overlay">
                <h2 class="gameover-title">💥 Game Over</h2>
                <p>Final Score: <span id="final-score" class="bold-text">0</span></p>
                <button id="restart-btn" class="action-btn">TRY AGAIN</button>
            </div>
        </div>

        <button id="drop-btn" class="action-btn drop-btn-layout" disabled>PLACE BLOCK</button>
    </div>

    <!-- ==========================================================================
       4. SANITIZED CORE ENGINE GAMEPLAY RUNTIME
       ========================================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const canvas = document.getElementById('gameCanvas');
            const ctx = canvas.getContext('2d');

            const currentScoreEl = document.getElementById('current-score');
            const highScoreEl = document.getElementById('high-score');
            const finalScoreEl = document.getElementById('final-score');
            const startOverlay = document.getElementById('start-overlay');
            const gameoverOverlay = document.getElementById('gameover-overlay');
            const startBtn = document.getElementById('start-btn');
            const restartBtn = document.getElementById('restart-btn');
            const dropBtn = document.getElementById('drop-btn');

            const CANVAS_WIDTH = 332;
            const CANVAS_HEIGHT = 400;
            const BLOCK_HEIGHT = 30;
            const INITIAL_SPEED = 3.0;

            let score = 0;
            let highScore = localStorage.getItem('stack_highScore') || 0;
            highScoreEl.textContent = highScore;

            let isPlaying = false;
            let animationFrameId = null;

            let currentBlock = { x: 0, y: 0, width: 200, direction: 1, speed: INITIAL_SPEED };
            let placedBlocks = [];
            let currentLevelIndex = 0;

            // Generate clean cascading deep purple shades
            function getLevelColor(index) {
                const lightness = Math.max(30, 65 - (index * 2));
                return `hsl(270, 75%, ${lightness}%)`;
            }

            function initGame() {
                score = 0;
                currentLevelIndex = 0;
                currentScoreEl.textContent = score;
                
                // Establish solid starting platform foundation block explicitly anchored
                placedBlocks = [{
                    x: (CANVAS_WIDTH - 200) / 2,
                    width: 200,
                    color: '#3d266e'
                }];
                
                spawnNextBlock();
                
                isPlaying = true;
                startOverlay.classList.remove('active');
                gameoverOverlay.classList.remove('active');
                dropBtn.disabled = false;
                
                // Clean running animation loop instances safely
                if (animationFrameId) {
                    cancelAnimationFrame(animationFrameId);
                }
                loop();
            }

            function spawnNextBlock() {
                currentLevelIndex = placedBlocks.length;
                const previousBlock = placedBlocks[placedBlocks.length - 1];
                
                // Track dynamic workspace baseline to prevent breaking bounds at ceiling heights
                let targetY = CANVAS_HEIGHT - (BLOCK_HEIGHT * currentLevelIndex);
                if (targetY < 100) {
                    targetY = 100; // Force baseline safety margins
                }
                
                currentBlock = {
                    x: currentBlock.direction > 0 ? 0 : CANVAS_WIDTH - previousBlock.width,
                    y: targetY,
                    width: previousBlock.width,
                    direction: Math.random() > 0.5 ? 1 : -1,
                    speed: INITIAL_SPEED + (currentLevelIndex * 0.12)
                };
            }

            function dropBlock() {
                if (!isPlaying) return;
