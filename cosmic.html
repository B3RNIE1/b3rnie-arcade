<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>b3rnie arcade - Cosmic Defender</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #0d0d1a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #arcade-container {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 100vh;
            max-height: 800px;
            background: #000;
            border: 4px solid #39ff14;
            box-shadow: 0 0 20px #39ff14;
            display: flex;
            flex-direction: column;
        }
        #gameCanvas {
            width: 100%;
            flex-grow: 1;
            background: radial-gradient(circle, #101026 0%, #05050a 100%);
            display: block;
        }
        #mobile-controls {
            display: none;
            width: 100%;
            height: 110px;
            background: #111;
            border-top: 2px solid #333;
            position: relative;
        }
        .touch-btn {
            position: absolute;
            background: rgba(255, 255, 255, 0.05);
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 10px;
        }
        #btn-left { left: 15px; top: 15px; width: 70px; height: 80px; }
        #btn-right { left: 100px; top: 15px; width: 70px; height: 80px; }
        #btn-fire { right: 15px; top: 15px; width: 110px; height: 80px; background: rgba(255, 0, 127, 0.1); border-color: #ff007f; color: #ff007f; }
        #btn-exit { left: 50%; transform: translateX(-50%); top: 15px; width: 80px; height: 80px; font-size: 0.9rem; border-color: #555; }
        
        @media (max-width: 768px) {
            #mobile-controls { display: block; }
            #arcade-container { border: none; box-shadow: none; height: 100vh; max-height: 100vh; }
        }
    </style>
</head>
<body>

    <div id="arcade-container">
        <!-- Canvas has hardcoded logical pixels, CSS handles fluid resizing -->
        <canvas id="gameCanvas" width="600" height="700"></canvas>
        
        <!-- Touch UI for mobile players -->
        <div id="mobile-controls">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
            <a href="index.html"><div class="touch-btn" id="btn-exit">EXIT</div></a>
            <div class="touch-btn" id="btn-fire">FIRE</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameActive = false;
        let showGameOver = false;
        let score = 0;
        let player;
        let bullets = [];
        let enemies = [];
        let particles = [];
        let keys = {};
        let spawnTimer = 0;
        let spawnInterval = 90; 

        let audioCtx = null;
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
        }
        
        function playLaserSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } catch(e){}
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } catch(e){}
        }

        class Player {
            constructor() {
                this.width = 40;
                this.height = 30;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 60;
                this.speed = 6;
                this.cooldown = 0;
            }
            draw() {
                ctx.fillStyle = '#00ffff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffff';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            update() {
                if (keys['ArrowLeft'] || keys['leftTouch']) this.x -= this.speed;
                if (keys['ArrowRight'] || keys['rightTouch']) this.x += this.speed;
                if (this.x < 0) this.x = 0;
                if (this.x > canvas.width - this.width) this.x = canvas.width - this.width;
                if (this.cooldown > 0) this.cooldown--;
                if ((keys[' '] || keys['fireTouch']) && this.cooldown === 0) {
                    bullets.push({ x: this.x + this.width / 2 - 2, y: this.y, w: 4, h: 12, speed: 8 });
                    playLaserSound();
                    this.cooldown = 12;
                }
            }
        }

        class Enemy {
            constructor() {
                this.width = 30;
                this.height = 30;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                this.speed = 2 + Math.random() * 2 + (score / 1500);
                this.color = ['#ff007f', '#ff0000', '#ff00ff'][Math.floor(Math.random() * 3)];
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
            update() {
                this.y += this.speed;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x; this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 6;
                this.speedY = (Math.random() - 0.5) * 6;
                this.color = color;
                this.alpha = 1;
            }
            draw() {
                ctx.save(); ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
            update() {
                this.x += this.speedX; this.y += this.speedY;
                this.alpha -= 0.02;
            }
        }

        function setupNewGame() {
            player = new Player();
            bullets = [];
            enemies = [];
            particles = [];
            score = 0;
            spawnTimer = 0;
            spawnInterval = 90;
            gameActive = true;
            showGameOver = false;
        }

        function triggerGameOver() {
            gameActive = false;
            showGameOver = true;
        }

        function createExplosion(x, y, color) {
            playExplosionSound();
            for (let i = 0; i < 15; i++) particles.push(new Particle(x, y, color));
        }

        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Space Star background
            if (Math.random() < 0.15) {
                particles.push({
                    x: Math.random() * canvas.width, y: 0, size: Math.random() * 2, speedY: 1 + Math.random() * 2,
                    color: '#ffffff', alpha: 0.4,
                    update: function() { this.y += this.speedY; },
                    draw: function() { ctx.fillStyle = `rgba(255,255,255,${this.alpha})`; ctx.fillRect(this.x, this.y, this.size, this.size); }
                });
            }

            if (gameActive) {
                player.update();
                player.draw();
                
                spawnTimer++;
                if (spawnTimer >= spawnInterval) {
                    enemies.push(new Enemy());
                    spawnTimer = 0;
                    if (spawnInterval > 25) spawnInterval -= 0.5;
                }
