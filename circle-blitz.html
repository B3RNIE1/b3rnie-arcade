<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B3A CIRCLE BLITZ - B3RNIE Arcade</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: #161824;
            --accent-brown: #8B4513;
            --text-main: #ffffff;
            --text-muted: #8f94ba;
            --success-green: #00ff66;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            height: 90vh;
            max-height: 700px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, var(--accent-brown) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-bottom: 20px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        #timer-display {
            color: var(--success-green);
        }

        #play-field {
            flex-grow: 1;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
        }

        /* Percentage-based layout completely bypasses 0px sizing errors */
        #target-node {
            position: absolute;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #A0522D 0%, #5C2E0B 100%);
            border: 3px solid rgba(255,255,255,0.7);
            border-radius: 50%;
            box-shadow: 0 10px 25px rgba(139, 69, 19, 0.6), inset 0 2px 6px rgba(255,255,255,0.4);
            cursor: pointer;
            display: block;
            transform: translate(-50%, -50%);
            z-index: 5;
            left: 50%;
            top: 50%;
        }

        #target-node:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(13, 14, 21, 0.95);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            z-index: 10;
            padding: 30px;
        }

        #game-over-screen.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .go-title {
            font-size: 2.2rem;
            font-weight: 800;
            color: #ff3b30;
            margin-bottom: 10px;
        }

        .go-result {
            font-size: 1.2rem;
            color: var(--text-muted);
            margin-bottom: 35px;
            text-align: center;
        }

        .btn {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 80%;
            max-width: 250px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px rgba(255,255,255,0.15);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255,255,255,0.1);
            margin-top: 12px;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: rgba(255,255,255,0.03);
            color: var(--text-main);
            box-shadow: none;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>CIRCLE BLITZ</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Time Remaining</div>
                <div class="stat-value" id="timer-display">15.0s</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Clicks Secured</div>
                <div class="stat-value" id="score-display">0</div>
            </div>
        </div>

        <div id="play-field">
            <div id="target-node"></div>
        </div>

        <div id="game-over-screen">
            <div class="go-title">TIME EXPIRED</div>
            <div class="go-result" id="final-result-text">You clicked the targets 0 times.</div>
            <button class="btn" id="restart-btn">Try Again ↻</button>
            <button class="btn btn-secondary" id="exit-btn">Arcade Hub</button>
        </div>
    </div>

    <script>
        const targetNode = document.getElementById('target-node');
        const scoreDisplay = document.getElementById('score-display');
        const timerDisplay = document.getElementById('timer-display');
        const gameOverScreen = document.getElementById('game-over-screen');
        const finalResultText = document.getElementById('final-result-text');
        
        const restartBtn = document.getElementById('restart-btn');
        const exitBtn = document.getElementById('exit-btn');

        let score = 0;
        let timeLeft = 15.0;
        let gameActive = false;
        let timerInterval = null;

        let audioCtx = null;
        function playSatisfyingPop() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            try {
                const now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                
                osc.frequency.setValueAtTime(600, now);
                osc.frequency.exponentialRampToValueAtTime(150, now + 0.06);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                
                osc.start(now);
                osc.stop(now + 0.06);
            } catch(e){}
        }

        function playEndTone() {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(320, now);
                osc.frequency.exponentialRampToValueAtTime(200, now + 0.25);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                gain.gain.setValueAtTime(0.2, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
                osc.start(now);
                osc.stop(now + 0.25);
            } catch(e){}
        }

        // Uses a pure percentage calculation framework so loading race conditions are impossible
        function relocateTarget() {
            const randomX = 10 + Math.random() * 80; // anywhere from 10% to 90% wide
            const randomY = 10 + Math.random() * 80; // anywhere from 10% to 90% high
            
            targetNode.style.left = randomX + '%';
            targetNode.style.top = randomY + '%';
        }

        function startSession() {
            score = 0;
            timeLeft = 15.0;
            scoreDisplay.innerText = score;
            timerDisplay.innerText = timeLeft.toFixed(1) + 's';
            gameOverScreen.classList.remove('visible');
            gameActive = true;
            
            relocateTarget();
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                if (!gameActive) return;
                timeLeft -= 0.1;
                if (timeLeft <= 0) {
                    timeLeft = 0;
                    endSession();
                }
