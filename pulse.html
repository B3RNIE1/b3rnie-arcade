<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B3A PULSE - B3RNIE Arcade</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: #161824;
            --accent-white: #ffffff;
            --text-main: #ffffff;
            --text-muted: #8f94ba;
            --success-green: #00ff66;
            --fail-red: #ff3b30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            height: 85vh;
            max-height: 650px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        #play-field {
            flex-grow: 1;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        /* Fixed-size wrapper container ensures layout never collapses to 0px */
        .ring-wrapper {
            position: relative;
            width: 260px;
            height: 260px;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #target-ring {
            width: 90px;
            height: 90px;
            border: 4px solid rgba(255, 255, 255, 0.25);
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #center-dot {
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
        }

        #pulse-ring {
            position: absolute;
            border: 3px solid var(--accent-white);
            border-radius: 50%;
            width: 100%;
            height: 100%;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.3);
            transform: scale(1);
            opacity: 0;
        }

        #feedback-text {
            position: absolute;
            bottom: 25px;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.1s ease;
            text-align: center;
            width: 100%;
        }

        .pop-feedback {
            opacity: 1 !important;
            transform: translateY(0px) !important;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 12px;
            width: 100%;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>PULSE</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Score Tally</div>
                <div class="stat-value" id="score-display">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Max Combo</div>
                <div class="stat-value" id="combo-display">0</div>
            </div>
        </div>

        <div id="play-field">
            <div class="ring-wrapper">
                <div id="target-ring">
                    <div id="center-dot"></div>
                </div>
                <div id="pulse-ring"></div>
            </div>
            <div id="feedback-text">PERFECT</div>
        </div>

        <a href="index.html" class="btn-secondary">Arcade Hub</a>
    </div>

    <script>
        const playField = document.getElementById('play-field');
        const pulseRing = document.getElementById('pulse-ring');
        const scoreDisplay = document.getElementById('score-display');
        const comboDisplay = document.getElementById('combo-display');
        const feedbackText = document.getElementById('feedback-text');

        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let gameActive = true;
        
        // Scale values (1.0 = 260px edge, 0.346 = exact match overlay with target ring)
        let ringScale = 1.0;
        let targetScale = 0.346; 
        let ringSpeed = 0.009; 
        
        let animationId = null;
        let feedbackTimeout = null;
        let audioCtx = null;

        function initAudioEngine() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e){}
        }

        function playSynthChime(type) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                
                if (type === 'PERFECT') {
                    osc.type = 'sine';
                    const baseFreq = 523.25; 
                    osc.frequency.setValueAtTime(baseFreq + (combo * 15), now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'GOOD') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(392.00, now); 
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now); osc.stop(now + 0.1);
                } else {
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(130, now);
                    gain.gain.setValueAtTime(0.25, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now); osc.stop(now + 0.3);
                }
            } catch(e){}
        }

        function updateRingLoop() {
            if (!gameActive) return;

            ringScale -= ringSpeed;
            
            if (ringScale <= 0.1) {
                triggerFeedback('MISS', 'var(--fail-red)');
                combo = 0;
                comboDisplay.innerText = combo;
                playSynthChime('MISS');
                resetRing();
            } else {
                pulseRing.style.transform = `scale(${ringScale})`;
                
                let opacity = ringScale > targetScale 
                    ? (1.0 - ringScale) / (1.0 - targetScale) 
                    : ringScale / targetScale;
                pulseRing.style.opacity = opacity;
            }

            animationId = requestAnimationFrame(updateRingLoop);
        }

        function resetRing() {
            ringScale = 1.0;
            ringSpeed = 0.009 + (score * 0.0001);
            if (ringSpeed > 0.025) ringSpeed = 0.025; 
        }

        function triggerFeedback(msg, color) {
            clearTimeout(feedbackTimeout);
            feedbackText.innerText = msg;
            feedbackText.style.color = color;
            feedbackText.classList.add('pop-feedback');
