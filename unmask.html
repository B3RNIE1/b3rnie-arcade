<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNMASK - B3RNIE Arcade</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --container-bg: #1a1a1c;
            --accent: #a855f7;
            --border-color: #3a3a3c;
            --correct: #10b981;
            --present: #eab308;
            --absent: #3f3f46;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }
        h1 { color: var(--accent); margin: 5px 0; font-size: 2rem; letter-spacing: 2px; }
        
        .master-key-container {
            margin: 10px 0;
            background: #27272a;
            border: 1px dashed var(--accent);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #a1a1aa;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .scrambled-letters {
            color: #fff;
            background: #121213;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .grid { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; margin: 15px 0; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile {
            width: 50px;
            height: 50px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            background: #27272a;
        }
        .tile.correct { background-color: var(--correct); border-color: var(--correct); }
        .tile.present { background-color: var(--present); border-color: var(--present); }
        .tile.absent { background-color: var(--absent); border-color: var(--absent); }
        
        .keyboard { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 450px; margin-top: 10px; }
        .kb-row { display: flex; justify-content: center; gap: 4px; width: 100%; }
        .key {
            background: #3f3f46;
            color: #fff;
            border: none;
            padding: 14px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            text-transform: uppercase;
            touch-action: manipulation;
        }
        .key.wide { flex: 1.5; font-size: 0.8rem; }
        #message { font-size: 1.1rem; font-weight: bold; margin-top: 10px; text-align: center; min-height: 24px; color: var(--accent); }
    </style>
</head>
<body>

    <h1>UNMASK</h1>
    <div style="font-size: 0.85rem; color: #a1a1aa; margin-bottom: 5px;">Deduce the secret 5-letter combination!</div>

    <div class="master-key-container">
        <span>🔑 MASTER CATEGORY CLUE:</span>
        <span class="scrambled-letters" id="master-clue-display">LOADING...</span>
    </div>

    <div class="grid" id="board"></div>
    <div id="message"></div>
    <div class="keyboard" id="keyboard"></div>

    <button onclick="window.location.href='index.html'" style="margin-top: 20px; background: #1a1a1c; border: 1px solid var(--border-color); color: #a1a1aa; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">Arcade Hub</button>

    <script>
        // Balanced 50-Word Array Matrix: 100% Real, single, clean dictionary words
        const masterChallenges = [
            { guessWord: "STAGE", masterWord: "PERFORMANCE" }, { guessWord: "TIMER", masterWord: "CHRONOMETER" },
            { guessWord: "CHAMP", masterWord: "CHAMPIONSHIP" }, { guessWord: "MATCH", masterWord: "COMPETITION" },
            { guessWord: "BOARD", masterWord: "SCOREBOARDS" }, { guessWord: "TRAIN", masterWord: "LOCOMOTIVES" },
            { guessWord: "BLOCK", masterWord: "OBSTRUCTIONS" }, { guessWord: "SHARK", masterWord: "OCEANOGRAPHY" },
            { guessWord: "SPACE", masterWord: "ASTRONAUTS" }, { guessWord: "EARTH", masterWord: "ENVIRONMENT" },
            { guessWord: "PLANT", masterWord: "VEGETATION" }, { guessWord: "STORM", masterWord: "METEOROLOGY" },
            { guessWord: "GHOST", masterWord: "SUPERNATURAL" }, { guessWord: "LIGHT", masterWord: "ILLUMINATION" },
            { guessWord: "CLOCK", masterWord: "TIMEKEEPING" }, { guessWord: "FLUID", masterWord: "AERODYNAMICS" },
            { guessWord: "SOUND", masterWord: "REVERBERATION" }, { guessWord: "PHONE", masterWord: "SMARTPHONES" },
            { guessWord: "BRAIN", masterWord: "INTELLIGENCE" }, { guessWord: "HEART", masterWord: "CARDIOVASCULAR" },
            { guessWord: "MOUTH", masterWord: "ARTICULATION" }, { guessWord: "GLASS", masterWord: "TRANSPARENCY" },
            { guessWord: "BRICK", masterWord: "CONSTRUCTION" }, { guessWord: "SHIRT", masterWord: "CLOTHIERS" },
            { guessWord: "PAPER", masterWord: "MANUFACTURE" }, { guessWord: "PAINT", masterWord: "MASTERPIECE" },
            { guessWord: "MUSIC", masterWord: "ORCHESTRATION" }, { guessWord: "DANCE", masterWord: "CHOREOGRAPHY" },
            { guessWord: "MOVIE", masterWord: "CINEMATOGRAPHY" }, { guessWord: "STORY", masterWord: "NARRATION" },
            { guessWord: "HOUSE", masterWord: "ARCHITECTURE" }, { guessWord: "MONEY", masterWord: "FINANCIALS" },
            { guessWord: "SHORE", masterWord: "COASTLINES" }, { guessWord: "TRAIL", masterWord: "BACKPACKING" },
            { guessWord: "FLAME", masterWord: "COMBUSTIBLE" }, { guessWord: "CROWN", masterWord: "SOVEREIGNTY" },
            { guessWord: "ROBOT", masterWord: "AUTOMATIONS" }, { guessWord: "WATER", masterWord: "HYDROLOGICAL" },
            { guessWord: "STEAK", masterWord: "GASTRONOMY" }, { guessWord: "BREAD", masterWord: "RESTAURANT" },
            { guessWord: "FRUIT", masterWord: "AGRICULTURE" }, { guessWord: "CHILD", masterWord: "KINDERGARTEN" },
            { guessWord: "TRUCK", masterWord: "TRANSPORTATION" }, { guessWord: "FLIGHT", masterWord: "AIRCRAFTS" },
            { guessWord: "PEARL", masterWord: "ACCESSORIES" }, { guessWord: "SHAPE", masterWord: "GEOMETRICAL" },
            { guessWord: "KNIFE", masterWord: "KITCHENWARE" }, { guessWord: "LOVER", masterWord: "RELATIONSHIP" },
            { guessWord: "SMILE", masterWord: "CHEERFULNESS" }, { guessWord: "SLEEP", masterWord: "HIBERNATIONS" }
        ];

        // Core dynamic tracking parameters initialized locally
        let secretWord = "";
        let displayClue = "";
        let currentRow = 0;
        let currentTile = 0;
        let guesses = ["", "", "", "", "", ""];
        let gameOver = false;

        function loadDailyChallenge() {
            const today = new Date().getDate();
            // Balanced index math bound cleanly to the length of the list pool container
            let dailyIndex = (today * 7) % masterChallenges.length;
            let challenge = masterChallenges[dailyIndex];
            
            secretWord = challenge.guessWord.toUpperCase();
            displayClue = challenge.masterWord.toUpperCase();
            
            document.getElementById('master-clue-display').innerText = displayClue;
            initBoard();
        }

        function initBoard() {
            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('div');
                row.className = 'row';
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.id = `tile-${i}-${j}`;
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }

            const kbLines = [
                ["q","w","e","r","t","y","u","i","o","p"],
                ["a","s","d","f","g","h","j","k","l"],
                ["ENTER", "z","x","c","v","b","n","m", "BACK"]
            ];
            const kbContainer = document.getElementById('keyboard');
            kbContainer.innerHTML = '';
            kbLines.forEach(line => {
                const row = document.createElement('div');
                row.className = 'kb-row';
                line.forEach(keyText => {
                    const button = document.createElement('button');
                    button.innerText = keyText;
                    button.className = 'key';
                    button.id = `key-${keyText.toLowerCase()}`;
                    if (keyText === "ENTER" || keyText === "BACK") button.classList.add('wide');
                    button.onclick = () => handleKey(keyText);
                    row.appendChild(button);
                });
                kbContainer.appendChild(row);
            });
        }

        function handleKey(key) {
            if (gameOver) return;
            const msg = document.getElementById('message');
            msg.innerText = '';

            const activeKey = key.toUpperCase();

            if (activeKey === "BACK" || activeKey === "BACKSPACE") {
                if (currentTile > 0) {
                    currentTile--;
                    guesses[currentRow] = guesses[currentRow].slice(0, -1);
