<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B3A HIGHER OR LOWER - B3RNIE Arcade</title>
    <style>
        body {
            background-color: #121213;
            color: #ffffff;
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 10px;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }
        h1 { color: #f97316; margin: 5px 0; font-size: 1.8rem; letter-spacing: 1px; text-align: center; }
        .score-board { font-size: 1.2rem; font-weight: bold; margin-bottom: 15px; color: #a1a1aa; }
        .game-grid {
            display: flex;
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-bottom: 20px;
        }
        .player-card {
            flex: 1;
            background: #1a1a1c;
            border: 2px solid #3a3a3c;
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 140px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .player-name { font-size: 1.1rem; font-weight: bold; margin-bottom: 10px; min-height: 44px; display: flex; align-items: center; justify-content: center; }
        .stat-label { font-size: 0.8rem; color: #a1a1aa; text-transform: uppercase; margin-bottom: 5px; }
        .stat-value { font-size: 1.8rem; font-weight: bold; color: #f97316; }
        .unknown-value { font-size: 2rem; color: #a1a1aa; animation: pulse 1s infinite alternate; }
        .btn-panel { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 500px; }
        .action-btn {
            background: #3f3f46;
            color: #fff;
            border: none;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            text-transform: uppercase;
            transition: background 0.1s;
        }
        .action-btn:hover { background: #52525b; }
        #higher-btn { background: #16a34a; }
        #higher-btn:hover { background: #15803d; }
        #lower-btn { background: #dc2626; }
        #lower-btn:hover { background: #b91c1c; }
        #msg-overlay { font-size: 1.2rem; font-weight: bold; margin-top: 10px; text-align: center; min-height: 28px; }
        @keyframes pulse { 0% { opacity: 0.5; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <h1>B3A HIGHER OR LOWER</h1>
    <div class="score-board">Current Streak: <span id="streak-val">0</span> | Best: <span id="best-val">0</span></div>

    <div class="game-grid">
        <div class="player-card" style="border-color: #f97316;">
            <div class="stat-label" id="stat-title-left">Career PPG</div>
            <div class="player-name" id="name-left">Loading...</div>
            <div class="stat-value" id="val-left">-</div>
        </div>
        <div class="player-card">
            <div class="stat-label" id="stat-title-right">Career PPG</div>
            <div class="player-name" id="name-right">Loading...</div>
            <div class="unknown-value" id="val-right">?</div>
        </div>
    </div>

    <div id="msg-overlay"></div>

    <div class="btn-panel" id="controls">
        <button class="action-btn" id="higher-btn" onclick="makeGuess('higher')">Higher ▲</button>
        <button class="action-btn" id="lower-btn" onclick="makeGuess('lower')">Lower ▼</button>
        <button class="action-btn" onclick="window.location.href='index.html'" style="background:#1a1a1c; border:1px solid #3a3a3c; color:#a1a1aa; font-size:0.9rem; padding:8px;">Hub</button>
