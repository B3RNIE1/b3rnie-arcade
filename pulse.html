<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B3A PULSE - B3RNIE Arcade</title>
    <style>
        :root {
            --bg-color: #0d0e15;
            --card-bg: #161824;
            --accent-white: #ffffff;
            --text-main: #ffffff;
            --text-muted: #8f94ba;
            --success-green: #00ff66;
            --fail-red: #ff3b30;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            width: 100%;
            max-width: 500px;
            height: 85vh;
            max-height: 650px;
            background: var(--card-bg);
            border-radius: 24px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4), 0 0 0 1px rgba(255,255,255,0.05);
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(135deg, #ffffff 0%, #888888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 12px;
            text-align: center;
        }

        .stat-label {
            font-size: 0.8rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        #play-field {
            flex-grow: 1;
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.03);
            border-radius: 20px;
            position: relative;
            overflow: hidden;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
        }

        #target-ring {
            width: 90px;
            height: 90px;
            border: 4px solid rgba(255, 255, 255, 0.15);
            border-radius: 50%;
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #center-dot {
            width: 12px;
            height: 12px;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 10px #ffffff;
        }

        #pulse-ring {
            position: absolute;
            border: 3px solid var(--accent-white);
            border-radius: 50%;
            pointer-events: none;
            width: 250px;
            height: 250px;
            opacity: 0;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
        }

        #feedback-text {
            position: absolute;
            bottom: 40px;
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            pointer-events: none;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.1s ease;
        }

        .pop-feedback {
            opacity: 1 !important;
            transform: translateY(0px) !important;
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 12px 24px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: 12px;
            width: 100%;
            text-align: center;
            transition: all 0.2s ease;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
        }

        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(22, 24, 36, 0.96);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 30px;
            z-index: 10;
        }

        .go-title {
            font-size: 2.2rem;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text-main);
            text-align: center;
        }

        .go-result {
            font-size: 1.1rem;
            color: var(--text-muted);
            margin-bottom: 35px;
            text-align: center;
            max-width: 85%;
            line-height: 1.5;
        }

        .btn-action {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 14px 28px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            width: 80%;
            max-width: 250px;
            text-align: center;
            box-shadow: 0 10px 20px rgba(255,255,255,0.1);
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>PULSE</h1>
        
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Score Tally</div>
                <div class="stat-value" id="score-display">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Max Combo</div>
                <div class="stat-value" id="combo-display">0</div>
            </div>
        </div>

        <div id="play-field">
            <div id="target-ring">
                <div id="center-dot"></div>
            </div>
            <div id="pulse-ring"></div>
            <div id="feedback-text">PERFECT</div>
        </div>

        <a href="index.html" class="btn-secondary">Arcade Hub</a>

        <div id="menu-overlay">
            <div class="go-title" id="overlay-title">B3A PULSE</div>
            <div class="go-result" id="overlay-desc">Tap the playfield EXACTLY when the shrinking outer white ring overlaps perfectly with the inner target ring.</div>
            <button class="btn-action" id="action-btn">ENGAGE MATCH</button>
            <a href="index.html" class="btn-secondary" style="max-width: 250px;">Arcade Hub</a>
        </div>
    </div>

    <script>
        const playField = document.getElementById('play-field');
        const pulseRing = document.getElementById('pulse-ring');
        const scoreDisplay = document.getElementById('score-display');
        const comboDisplay = document.getElementById('combo-display');
        const feedbackText = document.getElementById('feedback-text');
        
        const overlay = document.getElementById('menu-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayDesc = document.getElementById('overlay-desc');
        const actionBtn = document.getElementById('action-btn');

        let score = 0;
        let combo = 0;
        let maxCombo = 0;
        let gameActive = false;
        
        let ringSize = 250;
        let targetSize = 90; 
        let ringSpeed = 2.2;
        let animationId = null;
        let feedbackTimeout = null;
        let audioCtx = null;

        // Fully sandboxed audio engine initialization code block
        function initAudioEngine() {
            try {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx && audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
            } catch(e) {
                console.log("Audio contexts blocked by platform architecture:", e);
            }
        }

        function playSynthChime(type) {
            if (!audioCtx) return;
            try {
                const now = audioCtx.currentTime;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                
                if (type === 'PERFECT') {
                    osc.type = 'sine';
                    const baseFreq = 523.25; 
                    osc.frequency.setValueAtTime(baseFreq + (combo * 15), now);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now); osc.stop(now + 0.15);
                } else if (type === 'GOOD') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(392.00, now); 
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
