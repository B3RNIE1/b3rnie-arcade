<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aim Sprint | B3RNIE Arcade</title>
    <style>
        /* ==========================================================================
           1. CORE THEME & LAYOUT (B3RNIE Arcade Purple Palette Style)
           ========================================================================== */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .arcade-card {
            background-color: #111111;
            border: 1px solid #2a1b4e;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.15);
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-emoji {
            font-size: 2rem;
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #a04ef6, #621fa7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            background-color: #07050c;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #1f1435;
        }

        .score-box {
            font-size: 0.95rem;
            color: #b19ffb;
        }

        .bold-text {
            font-weight: 700;
            color: #ffffff;
        }

        /* Time Limit Shrinking Bar */
        .timer-bar-container {
            width: 100%;
            height: 6px;
            background-color: #1a1525;
            border-radius: 3px;
            overflow: hidden;
        }

        #timer-bar {
            width: 100%;
            height: 100%;
            background-color: #8a2be2;
            transition: width 0.1s linear;
        }

        /* ==========================================================================
           2. SPRINT TARGET ARENA BOUNDS
           ========================================================================== */
        .arena-wrapper {
            position: relative;
            width: 332px;
            height: 332px;
            border-radius: 8px;
            background-color: #060409;
            border: 1px solid #201438;
            margin: 0 auto;
            overflow: hidden;
            cursor: crosshair;
        }

        /* The Purple Target Node Component */
        #target-node {
            position: absolute;
            width: 40px;
            height: 40px;
            background: radial-gradient(circle, #ffffff 20%, #a04ef6 40%, #621fa7 100%);
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.6);
            transform: translate(-50%, -50%);
            cursor: pointer;
            top: 50%;
            left: 50%;
            display: block;
            transition: transform 0.05s ease;
        }

        #target-node:active {
            transform: translate(-50%, -50%) scale(0.9);
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(6, 4, 9, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
            z-index: 10;
        }

        #gameover-overlay {
            display: none;
        }

        .instruction-text {
            color: #c9bfeb;
            line-height: 1.5;
            margin-bottom: 20px;
            font-size: 0.95rem;
        }

        .gameover-title {
            margin: 0 0 10px 0;
            color: #ff4a4a;
        }

        /* ==========================================================================
           3. INTERACTIVE LAYOUT TRIGGER ACTION ARCS
           ========================================================================== */
        .action-btn {
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.1s ease;
            width: 100%;
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
            text-transform: uppercase;
        }

        .action-btn:hover {
            background-color: #993ff3;
        }
    </style>
</head>
<body>

    <div class="arcade-card">
        <div class="header-section">
            <span class="game-emoji">🎯</span>
            <h1 class="game-title">Aim Sprint</h1>
        </div>

        <div class="score-container">
            <div class="score-box">Targets Hit: <span id="current-score" class="bold-text">0</span></div>
            <div class="score-box">Best Sprint: <span id="high-score" class="bold-text">0</span></div>
        </div>

        <div class="timer-bar-container">
            <div id="timer-bar"></div>
        </div>

        <div class="arena-wrapper" id="arena">
            <div id="target-node"></div>
            
            <!-- Start Screen Overlay -->
            <div id="start-overlay" class="overlay">
                <p class="instruction-text">Hit as many targets as you humanly can before your 15-second fuel sprint bar runs out!</p>
                <button id="start-btn" class="action-btn">START SPRINT</button>
            </div>
            
            <!-- Game Over Screen Overlay -->
            <div id="gameover-overlay" class="overlay">
                <h2 class="gameover-title">💥 Time's Up!</h2>
                <p>Score: <span id="final-score" class="bold-text">0</span></p>
                <button id="restart-btn" class="action-btn" style="margin-top: 15px;">PLAY AGAIN</button>
            </div>
        </div>
    </div>

    <!-- ==========================================================================
       4. SECURE DOM EVENT ENGINE ARCHITECTURE
       ========================================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const targetNode = document.getElementById('target-node');
            const arena = document.getElementById('arena');
            const timerBar = document.getElementById('timer-bar');
            
            const startOverlay = document.getElementById('start-overlay');
            const gameoverOverlay = document.getElementById('gameover-overlay');
            const startBtn = document.getElementById('start-btn');
            const restartBtn = document.getElementById('restart-btn');
            
            const currentScoreEl = document.getElementById('current-score');
            const highScoreEl = document.getElementById('high-score');
            const finalScoreEl = document.getElementById('final-score');

            let score = 0;
            let highScore = localStorage.getItem('aimsprint_highScore') || 0;
            highScoreEl.textContent = highScore;

            let gameTimer = null;
            let timeRemaining = 15; // Simple 15 second clock
            const GAME_DURATION = 15;

            function startSprint() {
                score = 0;
                timeRemaining = GAME_DURATION;
                currentScoreEl.textContent = score;
                timerBar.style.width = "100%";

                startOverlay.style.display = "none";
                gameoverOverlay.style.display = "none";
                targetNode.style.display = "block";

                moveTargetRandomly();

                // Simple 1-second interval loop that will not lag or crash the browser
                clearInterval(gameTimer);
                gameTimer = setInterval(() => {
                    timeRemaining--;
                    let percentLeft = (timeRemaining / GAME_DURATION) * 100;
                    timerBar.style.width = `${percentLeft}%`;

                    if (timeRemaining <= 0) {
                        endSprint();
                    }
                }, 1000);
            }

            function moveTargetRandomly() {
                // Keep target at least 25 pixels away from edges inside the 332x332 box
                const padding = 25;
                const maxPos = 332 - (padding * 2);
                
                const randomX = padding + Math.floor(Math.random() * maxPos);
                const randomY = padding + Math.floor(Math.random() * maxPos);

                targetNode.style.left = `${randomX}px`;
                targetNode.style.top = `${randomY}px`;
            }

            function handleTargetHit(e) {
                e.stopPropagation(); // Stop clicking the arena behind it
                score++;
                currentScoreEl.textContent = score;
                moveTargetRandomly();
            }

            function endSprint() {
                clearInterval(gameTimer);
                targetNode.style.display = "none";
                
                if (score > highScore) {
                    highScore = score;
