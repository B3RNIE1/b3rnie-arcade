<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNMASK - B3RNIE Arcade</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --container-bg: #1a1a1c;
            --accent: #a855f7;
            --border-color: #3a3a3c;
            --correct: #10b981;
            --present: #eab308;
            --absent: #3f3f46;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', system-ui, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            box-sizing: border-box;
            user-select: none;
        }
        h1 { color: var(--accent); margin: 5px 0; font-size: 2rem; letter-spacing: 2px; }
        
        /* Master Key Display Section Layout */
        .master-key-container {
            margin: 10px 0;
            background: #27272a;
            border: 1px dashed var(--accent);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.9rem;
            color: #a1a1aa;
            font-weight: bold;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .scrambled-letters {
            color: #fff;
            background: #121213;
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            font-size: 1.1rem;
            letter-spacing: 2px;
        }

        .grid { display: grid; grid-template-rows: repeat(6, 1fr); gap: 5px; margin: 15px 0; }
        .row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; }
        .tile {
            width: 50px;
            height: 50px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            font-size: 1.5rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            text-transform: uppercase;
            background: #27272a;
        }
        .tile.correct { background-color: var(--correct); border-color: var(--correct); }
        .tile.present { background-color: var(--present); border-color: var(--present); }
        .tile.absent { background-color: var(--absent); border-color: var(--absent); }
        
        .keyboard { display: flex; flex-direction: column; gap: 6px; width: 100%; max-width: 450px; margin-top: 10px; }
        .kb-row { display: flex; justify-content: center; gap: 4px; width: 100%; }
        .key {
            background: #3f3f46;
            color: #fff;
            border: none;
            padding: 14px 10px;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            flex: 1;
            text-align: center;
            font-size: 0.9rem;
            text-transform: uppercase;
            touch-action: manipulation;
        }
        .key.wide { flex: 1.5; font-size: 0.8rem; }
        #message { font-size: 1.1rem; font-weight: bold; margin-top: 10px; text-align: center; min-height: 24px; color: var(--accent); }
    </style>
</head>
<body>

    <h1>UNMASK</h1>
    <div style="font-size: 0.85rem; color: #a1a1aa; margin-bottom: 5px;">Deduce the secret 5-letter combination!</div>

    <!-- NEW: Hidden Master Key Space with long 10-12 letter clues from earlier -->
    <div class="master-key-container">
        <span>🔑 MASTER CATEGORY CLUE:</span>
        <span class="scrambled-letters" id="master-clue-display">LOADING...</span>
    </div>

    <div class="grid" id="board"></div>
    <div id="message"></div>
    <div class="keyboard" id="keyboard"></div>

    <button onclick="window.location.href='index.html'" style="margin-top: 20px; background: #1a1a1c; border: 1px solid var(--border-color); color: #a1a1aa; padding: 10px 20px; border-radius: 6px; font-weight: bold; cursor: pointer;">Arcade Hub</button>

    <script>
        // Long 10-12 letter words connected to standard 5-letter game words
        const masterChallenges = [
            { guessWord: "COACH", masterWord: "HEADCOACHING" },
            { guessWord: "COURT", masterWord: "BASKETBALLS" },
            { guessWord: "SHOOT", fontWord: "THREEPOINTER" },
            { guessWord: "DRIVE", masterWord: "PLAYMAKING" },
            { guessWord: "MATCH", masterWord: "COMPETITIONS" },
            { guessWord: "SCORE", masterWord: "SCOREBOARDS" },
            { guessWord: "TIMER", masterWord: "CHRONOMETERS" },
            { guessWord: "CHAMP", masterWord: "CHAMPIONSHIP" }
        ];

        let challenge = masterChallenges[Math.floor(Math.random() * masterChallenges.length)];
        let secretWord = challenge.guessWord;
        let displayClue = challenge.masterWord || challenge.fontWord;

        let currentRow = 0;
        let currentTile = 0;
        let guesses = ["", "", "", "", "", ""];
        let gameOver = false;

        function initBoard() {
            // Set master clue string text
            document.getElementById('master-clue-display').innerText = displayClue;

            const board = document.getElementById('board');
            board.innerHTML = '';
            for (let i = 0; i < 6; i++) {
                const row = document.createElement('div');
                row.className = 'row';
                for (let j = 0; j < 5; j++) {
                    const tile = document.createElement('div');
                    tile.className = 'tile';
                    tile.id = `tile-${i}-${j}`;
                    row.appendChild(tile);
                }
                board.appendChild(row);
            }

            const kbLines = [
                ["q","w","e","r","t","y","u","i","o","p"],
                ["a","s","d","f","g","h","j","k","l"],
                ["ENTER", "z","x","c","v","b","n","m", "BACK"]
            ];
            const kbContainer = document.getElementById('keyboard');
            kbContainer.innerHTML = '';
            kbLines.forEach(line => {
                const row = document.createElement('div');
                row.className = 'kb-row';
                line.forEach(keyText => {
                    const button = document.createElement('button');
                    button.innerText = keyText;
                    button.className = 'key';
                    button.id = `key-${keyText.toLowerCase()}`;
                    if (keyText === "ENTER" || keyText === "BACK") button.classList.add('wide');
                    button.onclick = () => handleKey(keyText);
                    row.appendChild(button);
                });
                kbContainer.appendChild(row);
            });
        }

        function handleKey(key) {
            if (gameOver) return;
            const msg = document.getElementById('message');
            msg.innerText = '';

            const activeKey = key.toUpperCase();

            if (activeKey === "BACK" || activeKey === "BACKSPACE") {
                if (currentTile > 0) {
                    currentTile--;
                    guesses[currentRow] = guesses[currentRow].slice(0, -1);
                    document.getElementById(`tile-${currentRow}-${currentTile}`).innerText = '';
                }
            } else if (activeKey === "ENTER") {
                if (guesses[currentRow].length === 5) {
                    checkRow();
                } else {
                    msg.innerText = "Word must be 5 letters!";
                }
            } else {
                if (currentTile < 5 && /^[A-Z]$/.test(activeKey)) {
                    guesses[currentRow] += activeKey;
                    document.getElementById(`tile-${currentRow}-${currentTile}`).innerText = activeKey;
                    currentTile++;
                }
            }
        }

        function checkRow() {
            const guess = guesses[currentRow];
            
            for (let j = 0; j < 5; j++) {
                const tile = document.getElementById(`tile-${currentRow}-${j}`);
                const letter = guess[j];
                
                if (secretWord[j] === letter) {
                    tile.classList.add('correct');
                    updateKeyColor(letter, 'correct');
                } else if (secretWord.includes(letter)) {
                    tile.classList.add('present');
                    updateKeyColor(letter, 'present');
                } else {
                    tile.classList.add('absent');
                    updateKeyColor(letter, 'absent');
                }
            }

            if (guess === secretWord) {
                document.getElementById('message').innerText = "🎉 YOU UNMASKED THE WORD!";
                gameOver = true;
                return;
            }

            currentRow++;
            currentTile = 0;

            if (currentRow === 6) {
                document.getElementById('message').innerText = `Game Over! Word was: ${secretWord}`;
                gameOver = true;
            }
        }

        function updateKeyColor(letter, state) {
            const keyBtn = document.getElementById(`key-${letter.toLowerCase()}`);
            if (keyBtn) {
                if (state === 'correct') {
                    keyBtn.style.backgroundColor = 'var(--correct)';
                } else if (state === 'present' && keyBtn.style.backgroundColor !== 'var(--correct)') {
                    keyBtn.style.backgroundColor = 'var(--present)';
                } else if (state === 'absent' && !keyBtn.style.backgroundColor) {
                    keyBtn.style.backgroundColor = 'var(--absent)';
                }
            }
        }
