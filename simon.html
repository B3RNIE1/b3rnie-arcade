<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says | B3RNIE Arcade</title>
    <style>
        /* ==========================================================================
           1. CORE THEME & LAYOUT (B3RNIE Arcade Purple Palette Style)
           ========================================================================== */
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            user-select: none;
            -webkit-user-select: none;
        }

        .arcade-card {
            background-color: #111111;
            border: 1px solid #2a1b4e;
            border-radius: 12px;
            padding: 24px;
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 8px 32px rgba(138, 43, 226, 0.15);
        }

        .header-section {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .game-emoji {
            font-size: 2rem;
        }

        .game-title {
            font-size: 1.5rem;
            font-weight: 700;
            margin: 0;
            background: linear-gradient(135deg, #a04ef6, #621fa7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .score-container {
            display: flex;
            justify-content: space-between;
            background-color: #07050c;
            border-radius: 8px;
            padding: 12px;
            border: 1px solid #1f1435;
        }

        .score-box {
            font-size: 0.95rem;
            color: #b19ffb;
        }

        .bold-text {
            font-weight: 700;
            color: #ffffff;
        }

        /* ==========================================================================
           2. 4-QUADRANT PURPLE COLOR MATRIX GRID
           ========================================================================== */
        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(2, 1fr);
            gap: 12px;
            width: 300px;
            height: 300px;
            margin: 10px auto;
        }

        .color-pad {
            border-radius: 12px;
            cursor: pointer;
            opacity: 0.4; /* Base state is dim slate purple */
            transition: opacity 0.15s ease, transform 0.1s ease;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Clicking scaling animation */
        .color-pad:active {
            transform: scale(0.96);
        }

        /* Distinct variant custom shades tracking back to your brand theme colors */
        #pad-0 { background-color: #bd7bf9; box-shadow: 0 0 15px rgba(189,123,249,0.2); }
        #pad-1 { background-color: #8a2be2; box-shadow: 0 0 15px rgba(138,43,226,0.2); }
        #pad-2 { background-color: #4b0082; box-shadow: 0 0 15px rgba(75,0,130,0.2); }
        #pad-3 { background-color: #e3b6fe; box-shadow: 0 0 15px rgba(227,182,254,0.2); }

        /* Brightness active states managed entirely via simple class injection loops */
        .color-pad.flash-active {
            opacity: 1.0 !important;
            filter: brightness(1.3);
            box-shadow: 0 0 25px currentColor !important;
        }

        .status-banner {
            font-size: 0.95rem;
            font-weight: 700;
            color: #b19ffb;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-align: center;
            min-height: 22px;
        }

        /* ==========================================================================
           3. INTERFACE CONTROL ARCS
           ========================================================================== */
        .action-btn {
            background-color: #8a2be2;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 14px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background-color 0.1s ease;
            width: 100%;
            box-shadow: 0 4px 12px rgba(138, 43, 226, 0.3);
            text-transform: uppercase;
        }

        .action-btn:hover {
            background-color: #993ff3;
        }
    </style>
</head>
<body>

    <div class="arcade-card">
        <div class="header-section">
            <span class="game-emoji">🧠</span>
            <h1 class="game-title">Memory Matrix</h1>
        </div>

        <div class="score-container">
            <div class="score-box">Sequence Length: <span id="current-score" class="bold-text">0</span></div>
            <div class="score-box">Record Record: <span id="high-score" class="bold-text">0</span></div>
        </div>

        <!-- 4 Core Color Nodes Grid Mapping -->
        <div class="matrix-grid">
            <div class="color-pad" id="pad-0" data-id="0"></div>
            <div class="color-pad" id="pad-1" data-id="1"></div>
            <div class="color-pad" id="pad-2" data-id="2"></div>
            <div class="color-pad" id="pad-3" data-id="3"></div>
        </div>

        <div id="status-message" class="status-banner">TAP START TO TEST MEMORY</div>

        <button id="action-btn" class="action-btn">START GAME</button>
    </div>

    <!-- ==========================================================================
       4. BULLETPROOF PATTERN TRACKING MOTOR LOGIC
       ========================================================================== -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const statusMessage = document.getElementById('status-message');
            const actionBtn = document.getElementById('action-btn');
            const currentScoreEl = document.getElementById('current-score');
            const highScoreEl = document.getElementById('high-score');
            const pads = document.querySelectorAll('.color-pad');

            let computerPattern = [];
            let playerPattern = [];
            let score = 0;
            let highScore = localStorage.getItem('matrix_highScore') || 0;
            highScoreEl.textContent = highScore;

            let isComputerTurn = false;
            let patternIndex = 0;

            actionBtn.addEventListener('click', () => {
                startNewGame();
            });

            pads.forEach(pad => {
                pad.addEventListener('click', handlePadInput);
            });

            function startNewGame() {
                score = 0;
                computerPattern = [];
                currentScoreEl.textContent = score;
                actionBtn.style.visibility = "hidden"; // Hide during session
                
                advanceNextRound();
            }

            function advanceNextRound() {
                playerPattern = [];
                patternIndex = 0;
                isComputerTurn = true;
                statusMessage.style.color = "#b19ffb";
                statusMessage.textContent = "WATCH THE PATTERN...";

                // Push a random color index from 0 to 3 into the matrix tracking array
                computerPattern.push(Math.floor(Math.random() * 4));
                currentScoreEl.textContent = computerPattern.length;

                // Playback pattern queue array with clean spacing timeouts
                let i = 0;
                const playbackInterval = setInterval(() => {
                    flashPad(computerPattern[i]);
                    i++;
                    
                    if (i >= computerPattern.length) {
                        clearInterval(playbackInterval);
                        setTimeout(() => {
                            isComputerTurn = false;
                            statusMessage.style.color = "#a04ef6";
                            statusMessage.textContent = "YOUR TURN! REPEAT IT!";
                        }, 400);
                    }
                }, 600);
            }

            function flashPad(id) {
                const pad = document.getElementById(`pad-${id}`);
                if (!pad) return;

                pad.classList.add('flash-active');
                setTimeout(() => {
                    pad.classList.remove('flash-active');
                }, 300);
            }

            function handlePadInput(e) {
                if (isComputerTurn) return; // Prevent breaking loops during computer plays

                const clickedId = parseInt(e.target.dataset.id);
                flashPad(clickedId);
                
                // Compare to corresponding step index inside sequence
                if (clickedId === computerPattern[patternIndex]) {
                    patternIndex++;
                    
                    // Checked if full loop matches successfully
                    if (patternIndex === computerPattern.length) {
                        score = computerPattern.length;
                        if (score > highScore) {
                            highScore = score;
                            localStorage.setItem('matrix_highScore', highScore);
                            highScoreEl.textContent = highScore;
                        }

                        statusMessage.style.color = "#00ff66";
                        statusMessage.textContent = "PERFECT match!";
                        
                        // Small block latency pause before adding next color
