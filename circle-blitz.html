<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Simon Says | B3RNIE Arcade</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body {
            background-color: #0d0d1a;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #arcade-container {
            width: 100%;
            max-width: 600px;
            height: 100vh;
            max-height: 800px;
            background: #000;
            border: 4px solid #39ff14;
            box-shadow: 0 0 20px #39ff14;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        #play-field {
            flex-grow: 1;
            background: radial-gradient(circle, #1A0F0A 0%, #050302 100%);
            position: relative;
            width: 100%;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px;
        }
        /* Exact Text Headers Matching Simon UI layout */
        .emoji-header {
            font-size: 3rem;
            margin-bottom: 10px;
        }
        h1 {
            font-size: 2.5rem;
            color: #fff;
            letter-spacing: 2px;
            margin-bottom: 30px;
            font-weight: bold;
        }
        .metric-box {
            font-size: 1.4rem;
            margin: 10px 0;
            color: #fff;
        }
        .metric-val {
            color: #39ff14;
            font-weight: bold;
        }
        /* Custom styled floating node target circle */
        #target-node {
            position: absolute;
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, #ff007f 0%, #aa0055 100%);
            border: 4px solid #fff;
            border-radius: 50%;
            box-shadow: 0 0 20px #ff007f, inset 0 0 10px rgba(255,255,255,0.8);
            cursor: pointer;
            display: none;
            transform: translate(-50%, -50%);
            z-index: 5;
        }
        /* Screen Overlay matching Simon START GAME state UI */
        .overlay-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 10, 8, 0.98);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            z-index: 10;
        }
        .btn {
            background: transparent;
            color: #00ffff;
            border: 2px solid #00ffff;
            padding: 12px 30px;
            font-size: 1.2rem;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
            text-transform: uppercase;
            font-weight: bold;
            margin-top: 30px;
        }
        .btn:hover {
            background: #00ffff;
            color: #000;
            box-shadow: 0 0 20px #00ffff;
        }
        /* Bottom HUD Control Panel Panel Bar styling matching your index grids */
        #hud-panel {
            height: 90px;
            background: #1A0F0A;
            border-top: 3px solid #8B4513;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .btn-exit {
            background: transparent;
            color: #ff007f;
            border: 2px solid #ff007f;
            padding: 10px 24px;
            font-family: inherit;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            text-decoration: none;
            font-size: 1rem;
            border-radius: 4px;
        }
        .btn-exit:hover {
            background: #ff007f;
            color: #000;
            box-shadow: 0 0 10px #ff007f;
        }
    </style>
</head>
<body>

    <div id="arcade-container">
        <div id="play-field">
            <div class="emoji-header">🧠</div>
            <h1># Circle Blitz</h1>
            
            <div class="metric-box">Sequence: <span id="score-val" class="metric-val">0</span></div>
            <div class="metric-box">Time Left: <span id="timer-val" class="metric-val">15</span>s</div>

            <!-- Target Floating Circle -->
            <div id="target-node"></div>

            <!-- Start / Match Finish Menu Overlay display container -->
            <div id="overlay" class="overlay-screen">
                <div class="emoji-header" id="overlay-emoji">🧠</div>
                <h1 id="menu-title"># Circle Blitz</h1>
                <div class="metric-box" id="menu-desc" style="max-width: 80%; line-height: 1.6;">TAP START TO TEST VELOCITY</div>
                <button class="btn" id="action-btn">START GAME</button>
            </div>
        </div>
        
        <!-- Dashboard Footer -->
        <div id="hud-panel">
            <a href="index.html" class="btn-exit">Exit to Menu</a>
        </div>
    </div>

    <script>
        const playField = document.getElementById('play-field');
        const targetNode = document.getElementById('target-node');
        const scoreDisplay = document.getElementById('score-val');
        const timerDisplay = document.getElementById('timer-val');
        
        const overlay = document.getElementById('overlay');
        const overlayEmoji = document.getElementById('overlay-emoji');
        const menuTitle = document.getElementById('menu-title');
        const menuDesc = document.getElementById('menu-desc');
        const actionBtn = document.getElementById('action-btn');

        let score = 0;
        let timeLeft = 15;
        let gameRunning = false;
        let countdownTimer = null;

        // Web Audio Synthesizer Chord Generation
        let audioCtx = null;
        function playSatisfyingClick() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            
            try {
                const now = audioCtx.currentTime;
                
                // Root sine note for clean fundamental weight warmth
                let osc1 = audioCtx.createOscillator();
                let gain1 = audioCtx.createGain();
                osc1.type = 'sine';
                osc1.frequency.setValueAtTime(523.25, now); // C5
                osc1.frequency.exponentialRampToValueAtTime(783.99, now + 0.08); // slide up cleanly to G5
                
                // Soft triangle minor third overlay harmonic element for juicy texture depth
                let osc2 = audioCtx.createOscillator();
                let gain2 = audioCtx.createGain();
                osc2.type = 'triangle';
                osc2.frequency.setValueAtTime(659.25, now); // E5
                
                // Connect audio channels together safely
                osc1.connect(gain1); gain1.connect(audioCtx.destination);
                osc2.connect(gain2); gain2.connect(audioCtx.destination);
                
                // Sculpt clean explosive decay envelopes to prevent clipping artifacts
                gain1.gain.setValueAtTime(0.2, now);
                gain1.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
                
                gain2.gain.setValueAtTime(0.08, now);
                gain2.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                
                osc1.start(now); osc1.stop(now + 0.12);
                osc2.start(now); osc2.stop(now + 0.12);
            } catch(e){}
        }

        function playEndChirp(success) {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(success ? 880 : 180, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                osc.start(); osc.stop(audioCtx.currentTime + 0.3);
            } catch(e){}
        }

        function relocateCircle() {
            const fieldWidth = playField.clientWidth;
            const fieldHeight = playField.clientHeight;
            
            // Stay inside bounding box area lines safely away from textual layout headers
            const minX = 50;
            const maxX = fieldWidth - 50;
            const minY = 220; // safe clearance buffer underneath headers
            const maxY = fieldHeight - 50;
            
            const randomX = minX + Math.random() * (maxX - minX);
            const randomY = minY + Math.random() * (maxY - minY);
            
            targetNode.style.left = randomX + 'px';
            targetNode.style.top = randomY + 'px';
        }

        function startMatch() {
            score = 0;
            timeLeft = 15;
            scoreDisplay.innerText = score;
            timerDisplay.innerText = timeLeft;
            overlay.style.display = 'none';
            targetNode.style.display = 'block';
            gameRunning = true;
            
            relocateCircle();
            playEndChirp(true);
            
            clearInterval(countdownTimer);
            countdownTimer = setInterval(() => {
                timeLeft--;
                timerDisplay.innerText = timeLeft;
