    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let gameActive = false;
        let score = 0;
        let player;
        let bullets = [];
        let enemies = [];
        let particles = [];
        let keys = {};
        let spawnTimer = 0;
        let spawnInterval = 90; 

        // Sound Synthesis setup (Starts as null to prevent browser blocking errors)
        let audioCtx = null;
        
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }
        
        function playLaserSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) { console.log(e); }
        }

        function playExplosionSound() {
            if (!audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.3);
                gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.3);
            } catch(e) { console.log(e); }
        }

        class Player {
            constructor() {
                this.width = 40;
                this.height = 30;
                this.x = canvas.width / 2 - this.width / 2;
                this.y = canvas.height - 50;
                this.speed = 6;
                this.cooldown = 0;
            }
            draw() {
                ctx.fillStyle = '#00ffff';
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#00ffff';
                ctx.beginPath();
                ctx.moveTo(this.x + this.width / 2, this.y);
                ctx.lineTo(this.x, this.y + this.height);
                ctx.lineTo(this.x + this.width, this.y + this.height);
                ctx.closePath();
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            update() {
                if (keys['ArrowLeft'] || keys['leftTouch']) this.x -= this.speed;
                if (keys['ArrowRight'] || keys['rightTouch']) this.x += this.speed;
                if (this.x < 0) this.x = 0;
                if (this.x > canvas.width - this.width) this.x = canvas.width - this.width;
                if (this.cooldown > 0) this.cooldown--;
                if ((keys[' '] || keys['fireTouch']) && this.cooldown === 0) {
                    bullets.push({ x: this.x + this.width / 2 - 2, y: this.y, w: 4, h: 12, speed: 8 });
                    playLaserSound();
                    this.cooldown = 15;
                }
            }
        }

        class Enemy {
            constructor() {
                this.width = 30;
                this.height = 30;
                this.x = Math.random() * (canvas.width - this.width);
                this.y = -this.height;
                this.speed = 2 + Math.random() * 3 + (score / 1000);
                this.color = ['#ff007f', '#ff0000', '#ff00ff'][Math.floor(Math.random() * 3)];
            }
            draw() {
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 8;
                ctx.shadowColor = this.color;
                ctx.fillRect(this.x, this.y, this.width, this.height);
                ctx.shadowBlur = 0;
            }
            update() {
                this.y += this.speed;
            }
        }

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.size = Math.random() * 3 + 1;
                this.speedX = (Math.random() - 0.5) * 6;
                this.speedY = (Math.random() - 0.5) * 6;
                this.color = color;
                this.alpha = 1;
            }
            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.restore();
            }
            update() {
                this.x += this.speedX;
                this.y += this.speedY;
                this.alpha -= 0.02;
            }
        }

        function startGame() {
            // Unblock audio context safely on click event
            try { initAudio(); } catch(e) { console.log(e); }
            
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('gameover-screen').style.display = 'none';
            player = new Player();
            bullets = [];
            enemies = [];
            particles = [];
            score = 0;
            gameActive = true;
            spawnTimer = 0;
        }

        function gameOver() {
            gameActive = false;
            document.getElementById('gameover-screen').style.display = 'flex';
            document.getElementById('final-score').innerText = `Final Score: ${score}`;
        }

        function createExplosion(x, y, color) {
            playExplosionSound();
            for (let i = 0; i < 15; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        function rectIntersect(r1, r2) {
            return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
        }

        function loop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (Math.random() < 0.1) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: 0,
                    size: Math.random() * 2,
                    speedY: 1 + Math.random() * 2,
                    color: '#ffffff',
                    alpha: 0.5,
                    update: function() { this.y += this.speedY; },
                    draw: function() { ctx.fillStyle = this.color; ctx.fillRect(this.x, this.y, this.size, this.size); }
                });
            }

            if (gameActive) {
                player.update();
                player.draw();
                spawnTimer++;
                if (spawnTimer >= spawnInterval) {
                    enemies.push(new Enemy());
                    spawnTimer = 0;
                    if (spawnInterval > 30) spawnInterval -= 0.5;
                }
                for (let i = bullets.length - 1; i >= 0; i--) {
                    bullets[i].y -= bullets[i].speed;
                    ctx.fillStyle = '#fffb00';
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = '#fffb00';
                    ctx.fillRect(bullets[i].x, bullets[i].y, bullets[i].w, bullets[i].h);
                    ctx.shadowBlur = 0;
                    if (bullets[i].y < 0) bullets.splice(i, 1);
                }
                for (let i = enemies.length - 1; i >= 0; i--) {
                    enemies[i].update();
                    enemies[i].draw();
                    if (enemies[i].y > canvas.height) {
                        enemies.splice(i, 1);
                        score = Math.max(0, score - 50);
                        continue;
                    }
                    if (rectIntersect(
                        { x: player.x, y: player.y, w: player.width, h: player.height },
                        { x: enemies[i].x, y: enemies[i].y, w: enemies[i].width, h: enemies[i].height }
                    )) {
                        createExplosion(player.x + player.width/2, player.y + player.height/2, '#00ffff');
                        gameOver();
                        break;
                    }
                    for (let j = bullets.length - 1; j >= 0; j--) {
                        if (rectIntersect(
                            { x: bullets[j].x, y: bullets[j].y, w: bullets[j].w, h: bullets[j].h },
                            { x: enemies[i].x, y: enemies[i].y, w: enemies[i].width, h: enemies[i].height }
                        )) {
                            createExplosion(enemies[i].x + enemies[i].width/2, enemies[i].y + enemies[i].height/2, enemies[i].color);
                            enemies.splice(i, 1);
                            bullets.splice(j, 1);
                            score += 100;
                            break;
                        }
                    }
                }
            }

            for (let i = particles.length - 1; i >= 0; i--) {
                particles[i].update();
                particles[i].draw();
                if (particles[i].alpha <= 0 || particles[i].y > canvas.height) particles.splice(i, 1);
            }

            if (gameActive) {
                ctx.fillStyle = '#39ff14';
                ctx.font = "20px 'Courier New'";
                ctx.fillText(`SCORE: ${score}`, 20, 40);
            }
            requestAnimationFrame(loop);
        }
