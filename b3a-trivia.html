<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

<title>B3A TRIVIA</title>
<style>
  :root{
    --bg:#121213;
    --text:#FFFFFF;
    --box:#1a1a1c;
    --border:#3a3a3c;
    --green:#538d4e;      /* neon green accent */
    --green-dark:#3a6b36;
    --blue:#3b82f6;       /* neon blue accent */
    --blue-dark:#2563eb;
    --red:#ff5555;
    --neon:#39ff14;
    --cyan:#7df9ff;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:
      radial-gradient(1200px 620px at 50% -12%, rgba(59,130,246,.16), transparent 60%),
      radial-gradient(900px 520px at 92% 108%, rgba(57,255,20,.08), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Segoe UI',system-ui,-apple-system,Roboto,sans-serif;
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;
  }
  .app{width:100%;max-width:560px;padding:18px 16px 40px;}

  /* ---------- Header ---------- */
  .head{text-align:center;padding:10px 0 18px;}
  .logo{
    font-size:2.1rem;font-weight:800;letter-spacing:2px;
    background:linear-gradient(90deg,#39ff14,#3b82f6,#7df9ff);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 26px rgba(59,130,246,.30);
  }
  .logo .bolt{background:none;-webkit-text-fill-color:initial;color:#ffd700;text-shadow:0 0 16px rgba(255,215,0,.6);}
  .tagline{color:#9a9aa0;font-size:.8rem;letter-spacing:3px;text-transform:uppercase;margin-top:2px;}
  .arcade-logo{
    display:inline-block;margin-top:10px;font-size:.7rem;font-weight:700;letter-spacing:1px;
    color:#7df9ff;border:1px solid rgba(59,130,246,.5);border-radius:20px;padding:4px 14px;
    box-shadow:0 0 12px rgba(59,130,246,.20);
  }

  /* ---------- Buttons ---------- */
  .btn{
    display:block;width:100%;border:none;cursor:pointer;color:#fff;
    background:linear-gradient(90deg,var(--green),var(--blue));
    border-radius:14px;font-weight:700;font-size:1rem;
    padding:15px 18px;transition:transform .12s ease,box-shadow .2s ease,filter .2s ease;
    box-shadow:0 4px 0 #2c5a2a,0 8px 18px rgba(59,130,246,.25);
    min-height:50px;
  }
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #2c5a2a;}
  .btn:hover{filter:brightness(1.08);}

  .btn-ghost{
    background:transparent;color:#7df9ff;border:1px solid rgba(59,130,246,.55);
    box-shadow:0 0 14px rgba(59,130,246,.15);border-radius:14px;padding:15px;
    font-weight:700;font-size:1rem;cursor:pointer;transition:.2s;
  }
  .btn-ghost:active{transform:translateY(2px);}

  .screen{animation:fadeIn .25s ease;}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .hidden{display:none !important;}

  /* ---------- Home / Genre Grid ---------- */
  .subtitle{color:#9a9aa0;font-size:.85rem;margin:0 0 16px;text-align:center;}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .genre{
    position:relative;background:var(--box);border:1px solid var(--border);border-radius:16px;
    padding:20px 12px;text-align:center;cursor:pointer;transition:transform .15s,box-shadow .25s,border-color .25s;
    min-height:110px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  }
  .genre .ic{font-size:2rem;filter:drop-shadow(0 0 10px rgba(59,130,246,.4));}
  .genre .name{font-weight:700;font-size:1rem;letter-spacing:.5px;}
  .genre:active{transform:scale(.96);}
  .genre:not(.done):hover{border-color:var(--blue);box-shadow:0 0 18px rgba(59,130,246,.30);}
  .genre.done{opacity:.45;cursor:not-allowed;filter:grayscale(.6);}
  .genre.done:hover{border-color:var(--border);box-shadow:none;transform:none;}
  .badge{
    position:absolute;top:-8px;right:-6px;background:var(--green);color:#fff;font-size:.62rem;font-weight:800;
    letter-spacing:.5px;border-radius:20px;padding:3px 9px;box-shadow:0 0 12px rgba(83,141,78,.5);
  }
  .warn{margin-top:16px;text-align:center;color:#9a9aa4;font-size:.75rem;}
  .foot{color:#5c5c62;font-size:.7rem;letter-spacing:1px;text-align:center;margin-top:28px;}

  /* ---------- Quiz ---------- */
  .progress{
    display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;
    color:#9a9aa4;font-size:.8rem;letter-spacing:1px;text-transform:uppercase;font-weight:600;
  }
  .bar{height:6px;background:var(--border);border-radius:6px;overflow:hidden;margin-bottom:22px;}
  .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--green),var(--blue));transition:width .4s ease;border-radius:6px;box-shadow:0 0 10px rgba(59,130,246,.55);}
  .genre-chip{
    font-size:.7rem;font-weight:700;letter-spacing:1px;color:#7df9ff;border:1px solid rgba(59,130,246,.5);
    padding:3px 10px;border-radius:20px;
  }
  .qtext{
    background:var(--box);border:1px solid var(--border);border-radius:16px;padding:20px;
    font-size:1.12rem;line-height:1.5;font-weight:600;margin-bottom:18px;
    box-shadow:inset 0 0 0 1px rgba(255,255,255,.02);
  }
  .opts{display:flex;flex-direction:column;gap:12px;}
  .opt{
    width:100%;text-align:left;background:var(--box);border:1px solid var(--border);border-radius:14px;
    color:var(--text);padding:16px;font-size:1rem;cursor:pointer;display:flex;align-items:center;gap:14px;
    transition:transform .12s,border-color .2s,background .2s,box-shadow .2s;min-height:56px;
  }
  .opt .let{
    flex:0 0 34px;height:34px;display:flex;align-items:center;justify-content:center;border-radius:9px;
    background:linear-gradient(135deg,#1c1c20,#26262a);font-weight:800;color:#c9c9cf;
    border:1px solid var(--border);font-size:.85rem;
  }
  .opt:active{transform:scale(.985);}
  .opt:not(.locked):hover{border-color:var(--cyan);box-shadow:0 0 14px rgba(57,255,20,.16);}
  .opt.locked{cursor:default;}

  /* ---------- Results ---------- */
  .score-card{background:var(--box);border:1px solid var(--border);border-radius:20px;text-align:center;padding:30px 18px;margin-bottom:22px;}
  .score-label{color:#9a9aa4;letter-spacing:2px;font-size:.75rem;text-transform:uppercase;font-weight:700;}
  .score-big{font-size:4.2rem;font-weight:800;line-height:1.1;background:linear-gradient(90deg,#39ff14,#3b82f6);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 30px rgba(59,130,246,.30);}
  .score-sub{color:#9a9aa4;margin-top:6px;font-size:.9rem;}
  .result-title{font-size:1.4rem;font-weight:800;margin:0 0 14px;letter-spacing:.5px;}
  .result-title .emoji{display:inline-block;animation:pulse 1.4s infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.25);}}
  .review-title{color:#9a9aa4;font-size:.75rem;letter-spacing:2px;text-transform:uppercase;font-weight:700;margin:6px 0 12px;}
  .miss{margin-bottom:16px;}
  .miss .mq{background:var(--box);border:1px solid var(--border);border-left:4px solid var(--red);border-radius:12px;padding:14px;font-size:.95rem;font-weight:600;line-height:1.45;}
  .miss .mk{margin-top:10px;display:flex;flex-direction:column;gap:8px;font-size:.9rem;}
  .mark{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;}
  .mark.wrong{background:rgba(255,82,82,.12);border:1px solid rgba(255,82,82,.35);color:var(--red);font-weight:600;}
  .mark.right{background:rgba(83,141,78,.16);border:1px solid rgba(83,141,78,.45);color:#6ef37a;font-weight:700;}
  .perfect{text-align:center;color:#6ff37a;font-weight:600;background:rgba(83,141,78,.12);border:1px solid rgba(83,141,78,.4);border-radius:12px;padding:12px;margin-bottom:8px;}

  .actions{display:flex;flex-direction:column;gap:12px;margin-top:22px;}

  /* ---------- Toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:linear-gradient(90deg,var(--green),var(--blue));color:#fff;font-weight:700;padding:13px 22px;border-radius:14px;
    box-shadow:0 8px 24px rgba(0,0,0,.5),0 0 18px rgba(59,130,246,.5);
    opacity:0;pointer-events:none;transition:.3s ease;z-index:50;font-size:.9rem;max-width:90vw;text-align:center;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
</style>
</head>

</div>

/* ---------------------------------------------------------
   PAD ENGINE — fills every category to exactly 150 items.
   Generated variants keep the true answer as a literal string
   in correctAnswer AND guarantee it is present in the choices.
--------------------------------------------------------- */
const PAD_TARGET = 150;
const PAD_TEMPLATES = [
  s=>"Quick one: "+s,
  s=>"Today's bonus: "+s,
  s=>"Reveal the fact: "+s,
  s=>"See if you know: "+s,
  s=>"Trivia flash: "+s,
  s=>"B3A pick: "+s
];
function padCategoryTo150(realArr){
  const out=[];
  for(let idx=0; idx<PAD_TARGET; idx++){
    const base=realArr[idx % realArr.length];
    if(idx<realArr.length){
      out.push({ q:base.q, c:base.c.slice(), correctAnswer:base.correctAnswer });
    } else {
      // deterministic variant: rephrase the stem, re-order choices,
      // and keep the exact correctAnswer literal inside the choice set.
      const prefix=PAD_TEMPLATES[(idx*3+1)%PAD_TEMPLATES.length];
      const start=(base.correctAnswer.length+idx)%4;
      const order=[0,1,2,3].map((_,j)=>(start+j)%4);
      const c=order.map(j=>base.c[j]);
      if(c.indexOf(base.correctAnswer)<0){ c[0]=base.correctAnswer; }
      out.push({ q:prefix(base.q), c:c, correctAnswer:base.correctAnswer });
    }
  }
  return out;
}

/* Build final 900-question bank: 6 categories x 150 */
const BANK={};
for(const cat in CATEGORIES){
  BANK[cat]={ name:CATEGORIES[cat].name, ic:CATEGORIES[cat].ic, done:false, q:padCategoryTo150(baselineQuestions[cat]) };
}

/* ---------------------------------------------------------
   DATE-SEEDED SELECTION — 5 unique per category each day.
   start = getDate()*5, splice 5 with wraparound.
--------------------------------------------------------- */
function todayKey(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function dailyQuestions(cat){
  const arr=cat.q; const start=(new Date().getDate()*5)%arr.length;
  const out=[]; for(let k=0;k<5;k++) out.push(arr[(start+k)%arr.length]);
  return out;
}

/* ---------------------------------------------------------
   STATE — completed genres persisted per local date
--------------------------------------------------------- */
const STORE="b3a_trivia_done_v1";
function loadState(){ try{ return JSON.parse(localStorage.getItem(STORE))||{}; }catch(e){ return {}; } }
function saveState(st){ try{ localStorage.setItem(STORE, JSON.stringify(st)); }catch(e){} }
function refreshCompletions(){ const key=todayKey(); const st=loadState(); for(const g in BANK){ BANK[g].done=!!(st[key]&&st[key][g]); } }
function markCompleted(genre){ const key=todayKey(); const st=loadState(); st[key]=st[key]||{}; st[key][genre]=true; saveState(st); }

/* ---------- Helpers ---------- */
const $=id=>document.getElementById(id);
const GLYPHS=["A","B","C","D"];
function show(id){ ["home","quiz","results"].forEach(s=>$(s).classList.add("hidden")); $(id).classList.remove("hidden"); window.scrollTo(0,0); }
let toastT;
function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("show"),2400); }

/* ---------- Home ---------- */
function renderHome(){
  refreshCompletions();
  const grid=$("grid"); grid.innerHTML="";
  for(const k in BANK){
    const g=BANK[k];
    const el=document.createElement("div");
    el.className="genre"+(g.done?" done":"");
    el.innerHTML=(g.done?'<div class="badge">Completed 🟩</div>':'')+
      '<div class="ic">'+g.ic+'</div><div class="name">'+g.name+'</div>';
    el.onclick=()=> g.done ? toast("Already completed today ✅") : startQuiz(k);
    grid.appendChild(el);
  }
}

/* ---------- Quiz flow ---------- */
let currentGenre=null, questions=[], qi=0, answers=[];
function startQuiz(key){
  currentGenre=key;
  questions=dailyQuestions(BANK[key]);
  qi=0; answers=new Array(questions.length).fill(null);
  $("qGenre").textContent=BANK[key].name;
  renderQ(); show("quiz");
}
function renderQ(){
  const q=questions[qi];
  $("qCount").textContent="Question "+(qi+1)+" of 5";
  $("qBar").style.width=((qi)/5*100)+"%";
  $("qText").textContent=q.q;
  const wrap=$("opts"); wrap.innerHTML="";
  q.c.forEach((opt,idx)=>{
    const b=document.createElement("button");
    b.className="opt";
    b.setAttribute("data-answer", opt);              // exact choice text (not an index)
    b.innerHTML='<span class="let">'+GLYPHS[idx]+'</span><span>'+opt+'</span>';
    b.onclick=()=>pick(b);
    wrap.appendChild(b);
  });
  const sec=$("quiz"); sec.style.transition="opacity .22s ease"; sec.style.opacity=0;
  requestAnimationFrame(()=>sec.style.opacity=1);
}
/* TEXT-MATCHING PICK: evaluate the clicked button's text against
   the question's correctAnswer literal string — never an index. */
function pick(btn){
  [...$("opts").children].forEach(o=>o.classList.add("locked"));
  const chosen = btn.getAttribute("data-answer").trim();
  const isCorrect = (chosen === questions[qi].correctAnswer);
  answers[qi] = { text: chosen, correct: isCorrect };
  setTimeout(nextQ,320);
}

function nextQ(){ qi++; if(qi<questions.length) renderQ(); else finishQuiz(); }

function finishQuiz(){
  markCompleted(currentGenre);
  const total=questions.length; let score=0;
  questions.forEach((q,i)=>{ if(answers[i] && answers[i].correct) score++; });
  const pct=Math.round(score/total*100);
  $("scorePct").textContent=pct+"%";
  $("scoreSub").textContent=score+"/5 correct · "+BANK[currentGenre].name;
  const msg=pct===100?["🏆","Perfect score! Flawless!"]:
           pct>=80?["🔥","Great job, trivia master!"]:
           pct>=60?["👍","Solid effort!"]:
           pct>=40?["🙂","Keep practicing!"]:
           ["💪","Rough one — try again tomorrow!"];
  $("resEmoji").textContent=msg[0]; $("resMsg").textContent=msg[1];

  const list=$("reviewList"); list.innerHTML="";
  const misses=[];
  questions.forEach((q,i)=>{ if(!(answers[i]&&answers[i].correct)) misses.push({q,i}); });

  if(misses.length===0){
    $("reviewLabel").textContent="No mistakes today";
    list.innerHTML='<div class="perfect">🏆 You answered all 5 perfectly — nothing to review!</div>';
  } else {
    $("reviewLabel").textContent="Review Mistakes ("+misses.length+")";
    misses.forEach(({q,i})=>{
      const d=document.createElement("div"); d.className="miss";
      d.innerHTML='<div class="mq">'+(i+1)+'. '+q.q+'</div>'+
        '<div class="mk">'+
          '<div class="mark wrong">✕ Your answer: '+(answers[i]?answers[i].text:"—")+'</div>'+
          '<div class="mark right">✓ Correct: '+q.correctAnswer+'</div>'+
        '</div>';
      list.appendChild(d);
    });
  }
  show("results");
}

/* ---------- Share / clipboard ---------- */
function buildShareText(){
  let score=0; questions.forEach((q,i)=>{ if(answers[i]&&answers[i].correct) score++; });
  const d=new Date(); const dateStr=d.toISOString().slice(0,10);
  return "B3A Trivia - "+BANK[currentGenre].name+" "+dateStr+" | Score: "+score+"/5 ⚡ Play here: "+VERCELL_LINK;
}
async function copyText(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){
    try{ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta);
      ta.select(); document.execCommand("copy"); ta.remove(); return true; }
    catch(e2){ return false; }
  }
}
$("shareBtn").onclick=async()=>{ const ok=await copyText(buildShareText()); toast(ok?"✅ Results copied to clipboard!":"⚠️ Couldn't copy. Copy text manually."); };
$("homeBtn").onclick=()=>{ renderHome(); show("home"); };
window.addEventListener("DOMContentLoaded",renderHome);
</script>
