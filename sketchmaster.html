<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>B3A SKETCH MASTER - B3RNIE Arcade</title>
    <style>
        :root {
            --bg-color: #121213;
            --text-color: #ffffff;
            --container-bg: #1a1a1c;
            --accent: #f97316; /* Basketball Neon Orange Highlight */
            --border-color: #3a3a3c;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 0;
            padding: 15px;
            min-height: 100vh;
            box-sizing: border-box;
            overflow-x: hidden;
        }

        header {
            text-align: center;
            margin-bottom: 10px;
            width: 100%;
            max-width: 400px;
        }

        h1 {
            margin: 5px 0;
            color: var(--accent);
            letter-spacing: 2px;
            font-size: 1.8rem;
        }

        .game-container {
            width: 100%;
            max-width: 400px;
            background: var(--container-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .target-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            text-align: center;
            color: #fff;
        }

        /* Drawing Sandbox Area Wrapper */
        .canvas-area {
            position: relative;
            width: 320px;
            height: 320px;
            background: #27272a;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            overflow: hidden;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
            cursor: crosshair;
            touch-action: none; /* Stops phone from scrolling away while sketching */
        }

        /* Stylized hidden face blueprint vector mask overlays */
        .face-blueprint {
            position: absolute;
            top: 0;
            left: 0;
            width: 320px;
            height: 320px;
            z-index: 1;
            opacity: 0; /* Stays hidden from user memory until they hit submit */
            transition: opacity 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .svg-guide {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: rgba(249, 115, 22, 0.4);
            stroke-width: 4;
            stroke-linecap: round;
        }

        .btn-panel {
            display: flex;
            gap: 10px;
            width: 100%;
            max-width: 320px;
            margin-top: 15px;
        }

        button {
            flex: 1;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: bold;
            background-color: #3f3f46;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            text-transform: uppercase;
        }

        button:hover { background-color: #52525b; }
        #submit-btn { background-color: var(--accent); }
        #submit-btn:hover { background-color: #ea580c; }

        .progress-bar {
            font-size: 0.85rem;
            color: #a1a1aa;
            margin-bottom: 10px;
        }

        #result-popup {
            font-size: 1.5rem;
            font-weight: bold;
            color: #4ade80;
            margin-top: 10px;
            text-align: center;
            min-height: 30px;
        }
    </style>
</head>
<body>

        <h1>B3A SKETCH MASTER</h1>
        <div id="daily-progress" class="progress-bar">Star 1 of 3</div>
    </header>

    <div class="game-container">
        <div id="target-name" class="target-title">Draw: Loading...</div>
        
        <div class="canvas-area">
            <!-- Hidden face structure guide templates matching vectors database -->
            <div id="blueprint-view" class="face-blueprint">
                <svg class="svg-guide" viewBox="0 0 100 100">
                    <circle cx="50" cy="50" r="30" id="head-shape" />
                    <ellipse cx="50" cy="45" rx="20" ry="25" id="inner-features" />
                    <line x1="38" y1="42" x2="44" y2="42" />
                    <line x1="56" y1="42" x2="62" y2="42" />
                    <path d="M 42 62 Q 50 68 58 62" />
                </svg>
            </div>
            <canvas id="sketchpad" width="320" height="320"></canvas>
        </div>

        <div id="result-popup"></div>

        <div class="btn-panel">
            <button id="clear-btn">Clear</button>
            <button id="submit-btn">Submit Sketch</button>
            <button onclick="window.location.href='index.html'" style="background:#121213; border:1px solid var(--border-color);">Hub</button>

        // Calendar-Date Seeding Rotation Formula: Extracts 3 random unique targets based on today's date
        function loadDailyChallenges() {
            const today = new Date().getDate();
            let seededRandom = (today * 17) % masterPool.length;
            
            dailyStars = [];
            for (let i = 0; i < 3; i++) {
                let index = (seededRandom + i * 5) % masterPool.length;
                dailyStars.push(masterPool[index]);
            }
            startChallenge(0);
        }

        function startChallenge(index) {
            currentChallengeIndex = index;
            if (currentChallengeIndex >= 3) {
                document.getElementById('target-name').innerText = "🎉 All Done for Today!";

            const activeStar = dailyStars[currentChallengeIndex];

            document.getElementById('head-shape').setAttribute('r', activeStar.ry);
            document.getElementById('inner-features').setAttribute('cy', activeStar.cy);
            document.getElementById('inner-features').setAttribute('rx', activeStar.rx);
            document.getElementById('inner-features').setAttribute('ry', activeStar.ry - 4);
